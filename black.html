<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jolt</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/inter@latest/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/inter@latest/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/inter@latest/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/inter@latest/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/inter@latest/800.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>

*{margin:0;padding:0;box-sizing:border-box}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
a{text-decoration:none;color:inherit}
img{display:block}
html,body{background:#fff}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;color:#111;-webkit-font-smoothing:antialiased}
.container{max-width:1200px;margin:0 auto;padding:0 24px}
/* ---------- Announcement ---------- */
.announce{background:#f4f4f4;font-size:11px;color:#333;display:flex;align-items:center;justify-content:center;gap:10px;padding:7px 12px;text-align:center}
.announce .pill{background:#111;color:#fff;border-radius:999px;padding:3px 10px;font-size:9px;font-weight:600;flex-shrink:0}
/* ---------- Header ---------- */
.header{background:#fff;border-bottom:1px solid #ececec}
.header-in{display:flex;align-items:center;height:64px;gap:40px}
.logo{font-size:22px;font-weight:800;letter-spacing:-.02em;color:#111}
.nav{display:flex;gap:26px;font-size:13px;color:#111}
.nav a:hover{opacity:.65}
.h-right{margin-left:auto;display:flex;align-items:center;gap:22px;font-size:12.5px;color:#111}
.h-item{display:flex;align-items:center;gap:7px;cursor:pointer}
.h-item:hover{opacity:.65}
.h-item svg{width:16px;height:16px}
/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;font-weight:600;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-white{background:#fff;color:#111;padding:11px 30px;font-size:12px}
.btn-black{background:#111;color:#fff;padding:11px 26px;font-size:11.5px}
/* ---------- Hero ---------- */
.hero{position:relative;height:560px;background-position:center;background-size:cover}
.hero::after{content:'';position:absolute;inset:0;background:rgba(25,25,25,.30)}
.hero-in{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:0 24px}
.hero h1{font-size:54px;font-weight:700;letter-spacing:-.01em}
.hero p{margin-top:14px;max-width:660px;font-size:12.5px;line-height:1.7;color:#f2f2f2}
.hero .btn-white{margin-top:30px}
/* ---------- Sections ---------- */
.section{padding:72px 0}
.sec-title{font-size:30px;font-weight:700;text-align:center;letter-spacing:-.01em}
.sec-sub{margin-top:10px;text-align:center;font-size:12.5px;color:#8a8a8a}
/* ---------- Product cards ---------- */
.p-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:44px}
.p-img{position:relative;background:#f3f3f3;border-radius:10px;aspect-ratio:1;overflow:hidden;cursor:pointer}
.p-img img{width:100%;height:100%;object-fit:cover}
.heart{position:absolute;top:10px;right:10px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:#8b8b8b;border-radius:50%;z-index:2}
.heart svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8}
.heart.active{color:#e12d2d}
.heart.active svg{fill:#e12d2d;stroke:#e12d2d}
.badge{position:absolute;top:10px;left:10px;background:#e6e6e6;color:#666;font-size:10px;padding:4px 9px;border-radius:7px;font-weight:500;z-index:2}
.p-name{margin-top:12px;font-size:13px;color:#222}
.p-row{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.p-price{font-size:13px;font-weight:700}
.p-add{width:28px;height:28px;border:1px solid #e2e2e2;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:#111}
.p-add:hover{background:#111;color:#fff}
.p-add svg{width:13px;height:13px}
.see-all{margin:44px auto 0;display:flex;padding:12px 36px;font-size:12px}
/* ---------- Tokyo ---------- */
.tokyo{display:grid;grid-template-columns:1.05fr 1fr;gap:56px;align-items:center;padding:56px 0}
.tokyo-img{border-radius:6px;overflow:hidden;aspect-ratio:4/3;background:#eee}
.tokyo-img img{width:100%;height:100%;object-fit:cover}
.tokyo h2{font-size:27px;font-weight:700;line-height:1.35;letter-spacing:-.01em}
.tokyo p{margin-top:16px;font-size:12px;color:#9a9a9a;line-height:1.8}
.tokyo .sale-l{margin-top:26px;font-size:13px;font-weight:700;color:#111}
.tokyo .sale-n{font-size:52px;font-weight:800;margin:6px 0 18px;letter-spacing:-.02em}
/* ---------- Collections ---------- */
.coll-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:44px}
.coll-col{display:flex;flex-direction:column;gap:24px}
.coll-card{position:relative;border-radius:8px;overflow:hidden;background:#ccc}
.coll-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.coll-card::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.18)}
.coll-in{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:16px}
.coll-in h3{font-size:24px;font-weight:600}
.coll-in p{margin-top:8px;font-size:10.5px;color:#eee;max-width:230px;line-height:1.6}
.coll-in .btn-white{margin-top:14px;padding:8px 24px;font-size:11px}
/* ---------- Newsletter ---------- */
.news{position:relative;background-position:center;background-size:cover;padding:78px 24px;text-align:center;color:#fff}
.news::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.55)}
.news-in{position:relative;z-index:1}
.news h2{font-size:28px;font-weight:700}
.news p{margin:12px auto 26px;font-size:12px;color:#ddd;max-width:600px;line-height:1.7}
.news-form{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.news-input{width:300px;max-width:78vw;border-radius:999px;padding:11px 18px;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.18);color:#fff;font-size:12px;outline:none;font-family:inherit}
.news-input::placeholder{color:#e2e2e2}
.news-form .btn-white{padding:11px 28px;font-size:12px}
/* ---------- Footer ---------- */
.footer{background:#0c0c0c;color:#9ca3af;padding:56px 0 0;font-size:12px}
.f-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr auto;gap:40px;align-items:start}
.f-brand .logo{color:#fff;font-size:24px}
.f-brand p{margin-top:14px;line-height:1.8;max-width:250px}
.f-col h4{color:#fff;font-size:13px;font-weight:600;margin-bottom:18px}
.f-col a{display:block;margin-bottom:12px;color:#9ca3af}
.f-col a:hover{color:#fff}
.f-social{display:flex;gap:14px;color:#fff;padding-top:4px}
.f-social a:hover{opacity:.7}
.f-social svg{width:16px;height:16px}
.f-bottom{margin-top:48px;border-top:1px solid #1f1f1f;padding:18px 0 22px}
.f-bottom-in{position:relative;display:flex;align-items:center;justify-content:center;font-size:11px;color:#9ca3af}
.f-right{position:absolute;right:0;display:flex;gap:28px}
/* ---------- Product page ---------- */
.crumb{display:flex;gap:8px;align-items:center;font-size:11px;color:#9a9a9a;padding:18px 0}
.crumb a:hover{color:#111}
.crumb .sep{color:#cfcfcf}
.crumb .cur{color:#111}
.pdp{display:grid;grid-template-columns:1.12fr 1fr;gap:32px;align-items:start}
.gallery{display:grid;grid-template-columns:88px 1fr;gap:16px;align-items:start}
.thumbs{display:flex;flex-direction:column;gap:12px}
.thumb{width:88px;height:88px;border-radius:8px;overflow:hidden;background:#f3f3f3;padding:0;border:1px solid transparent;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.sel{border-color:#d5d5d5}
.thumb-more{width:40px;height:40px;margin:4px auto 0;border:1px solid #e3e3e3;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff}
.thumb-more:hover{background:#f5f5f5}
.main-img{position:relative;background:#f3f3f3;border-radius:12px;aspect-ratio:1;overflow:hidden}
.main-img img{width:100%;height:100%;object-fit:cover}
.disc{position:absolute;top:14px;left:14px;background:#ef3e36;color:#fff;font-size:11px;font-weight:600;padding:4px 9px;border-radius:6px}
.heart-circle{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.08);color:#333}
.heart-circle svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8}
.heart-circle.active{color:#e12d2d}
.heart-circle.active svg{fill:#e12d2d;stroke:#e12d2d}
.info h1{font-size:26px;font-weight:700;letter-spacing:-.01em}
.rate-row{display:flex;align-items:center;gap:10px;margin-top:12px}
.rate-count{font-size:12px;color:#8a8a8a}
.stars{display:inline-flex;gap:2px;align-items:center}
.star{position:relative;display:inline-block}
.star>svg{display:block}
.star-clip{position:absolute;left:0;top:0;height:100%;overflow:hidden;display:flex}
.price-row{display:flex;align-items:baseline;gap:12px;margin-top:16px}
.price{font-size:24px;font-weight:800}
.price-old{font-size:15px;color:#b0b0b0;text-decoration:line-through}
.p-desc{margin-top:16px;font-size:13px;color:#555;line-height:1.7;max-width:430px}
.opt{margin-top:22px;font-size:12px;color:#444}
.swatches{display:flex;gap:12px;margin-top:10px}
.swatch{width:30px;height:30px;border-radius:50%;cursor:pointer}
.swatch.sel{box-shadow:0 0 0 2px #fff,0 0 0 4px #111}
.qty-row{display:flex;gap:10px;margin-top:10px}
.qty-btn{width:38px;height:38px;border:1px solid #e2e2e2;border-radius:8px;background:#fff;font-size:16px}
.qty-btn:hover{background:#f5f5f5}
.qty-val{width:38px;height:38px;border:1px solid #e2e2e2;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px}
.add-cart{width:100%;margin-top:24px;background:#111;color:#fff;border-radius:999px;padding:14px;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px}
.add-cart:hover{opacity:.85}
.add-cart svg{width:15px;height:15px}
.buy-now{width:100%;margin-top:12px;background:#f1f1f1;color:#111;border-radius:999px;padding:14px;font-size:13px;font-weight:600}
.buy-now:hover{background:#e7e7e7}
.perks{display:flex;gap:28px;margin-top:26px}
.perk{display:flex;gap:10px;align-items:flex-start}
.perk svg{width:20px;height:20px;color:#111;flex-shrink:0}
.perk b{font-size:12px;display:block;font-weight:600}
.perk span{font-size:11px;color:#8a8a8a}
/* ---------- Description tabs ---------- */
.desc-sec{display:grid;grid-template-columns:1fr 1fr;gap:56px;margin-top:60px}
.tabs{display:flex;gap:34px;border-bottom:1px solid #e7e7e7}
.tab{padding:12px 2px;font-size:13px;color:#8a8a8a;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:#111;border-color:#111;font-weight:600}
.desc-body{padding-top:24px;font-size:13px;color:#555;line-height:1.8}
.desc-body ul{margin-top:18px;list-style:none}
.desc-body li{margin-bottom:12px;padding-left:16px;position:relative;font-size:12px;color:#666}
.desc-body li::before{content:'•';position:absolute;left:0;color:#666}
.desc-img{width:100%;height:100%;min-height:360px;object-fit:cover}
/* ---------- Reviews ---------- */
.reviews{margin-top:56px;border-top:1px solid #eee;padding-top:40px}
.rev-head{display:flex;align-items:center;justify-content:space-between}
.rev-head h2{font-size:17px;font-weight:700}
.rev-head h2 span{font-weight:500;color:#555}
.view-all{font-size:12px;color:#555}
.view-all:hover{color:#111}
.rev-grid{display:grid;grid-template-columns:auto 1fr 1.25fr auto;gap:44px;align-items:center;margin-top:28px}
.rev-score .big{font-size:52px;font-weight:800;letter-spacing:-.02em}
.rev-score .stars{margin:12px 0 10px}
.rev-score .sub{font-size:11px;color:#8a8a8a}
.bars{display:flex;flex-direction:column;gap:9px;min-width:250px}
.bar-row{display:flex;align-items:center;gap:8px;font-size:11px;color:#555}
.bar-row .n{width:8px}
.bar-row .star-i{color:#f59e0b;display:flex}
.bar-track{flex:1;height:5px;background:#ececec;border-radius:999px;overflow:hidden}
.bar-fill{height:100%;background:#111;border-radius:999px}
.bar-pct{width:32px;text-align:right;color:#777}
.rev-card{background:#f7f7f7;border-radius:12px;padding:22px}
.rev-top{display:flex;justify-content:space-between;align-items:center}
.rev-date{font-size:11px;color:#8a8a8a}
.rev-title{margin-top:14px;font-size:13px;font-weight:700}
.rev-text{margin-top:8px;font-size:12px;color:#666;line-height:1.7}
.rev-author{margin-top:14px;font-size:12px;font-weight:600}
.rev-nav{display:flex;gap:10px}
.rev-arrow{width:38px;height:38px;border:1px solid #e3e3e3;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
.rev-arrow:hover{background:#f5f5f5}
.rev-arrow svg{width:14px;height:14px}
.related h2{font-size:18px;font-weight:700;margin:56px 0 24px}
.rel-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:20px}
.rel-grid .p-name{font-size:12px}
.rel-grid .p-price{font-size:12px}
/* ---------- Responsive ---------- */
@media (max-width:1100px){
  .p-grid{grid-template-columns:repeat(3,1fr)}
  .rel-grid{grid-template-columns:repeat(3,1fr)}
  .rev-grid{grid-template-columns:auto 1fr;gap:32px}
  .f-grid{grid-template-columns:1.4fr 1fr 1fr;row-gap:36px}
  .f-social{grid-column:1/-1}
}
@media (max-width:900px){
  .nav{display:none}
  .pdp{grid-template-columns:1fr}
  .gallery{grid-template-columns:1fr}
  .thumbs{flex-direction:row;order:2;overflow-x:auto}
  .thumb{flex-shrink:0}
  .thumb-more{margin:0}
  .desc-sec{grid-template-columns:1fr;gap:28px}
  .desc-img{min-height:260px}
  .tokyo{grid-template-columns:1fr;gap:28px;padding:40px 0}
  .coll-grid{grid-template-columns:1fr 1fr}
  .rev-grid{grid-template-columns:1fr;gap:28px}
  .f-grid{grid-template-columns:1fr 1fr}
  .hero{height:460px}
  .hero h1{font-size:40px}
}
@media (max-width:640px){
  .p-grid{grid-template-columns:repeat(2,1fr);gap:14px}
  .rel-grid{grid-template-columns:repeat(2,1fr);gap:14px}
  .coll-grid{grid-template-columns:1fr}
  .hero h1{font-size:32px}
  .sec-title{font-size:24px}
  .tokyo h2{font-size:22px}
  .tokyo .sale-n{font-size:42px}
  .f-grid{grid-template-columns:1fr}
  .f-bottom-in{flex-direction:column;gap:10px}
  .f-right{position:static;gap:18px}
  .perks{flex-direction:column;gap:16px}
  .h-right{gap:14px}
  .section{padding:52px 0}
}

/* ===== HIDDEN INFRASTRUCTURE STYLES (toast, cart drawer, zoom overlay) ===== */
/* These styles are for NEW elements added to support black's backend services.
   They do NOT modify any existing black-update styles. */

/* Toast notification */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:#111;color:#fff;padding:12px 24px;border-radius:8px;font-size:13px;font-weight:500;z-index:99999;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.15);max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toastMsg{display:inline-block}

/* Cart drawer (slide-in from right) */
#cartOverlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9997;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
#cartOverlay.active{opacity:1;visibility:visible}
#cartDrawer{position:fixed;top:0;right:0;bottom:0;width:380px;max-width:90vw;background:#fff;z-index:9998;transform:translateX(100%);transition:transform .3s;display:flex;flex-direction:column;font-family:'Inter',sans-serif}
#cartDrawer.active{transform:translateX(0)}
#cartDrawer .cart-header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid #ececec}
#cartDrawer .cart-header h3{font-size:16px;font-weight:700;color:#111}
#cartDrawer .cart-close{font-size:24px;color:#999;background:none;border:none;cursor:pointer;line-height:1}
#cartDrawer .cart-close:hover{color:#111}
#cartDrawer .cart-body{flex:1;overflow-y:auto;padding:16px 20px}
#cartDrawer .cart-empty{text-align:center;padding:40px 20px;color:#888}
#cartDrawer .cart-empty svg{width:48px;height:48px;margin:0 auto 12px;display:block;stroke:#ccc}
#cartDrawer .cart-empty h4{font-size:15px;font-weight:600;color:#333;margin-bottom:6px}
#cartDrawer .cart-empty p{font-size:12px;color:#999}
#cartDrawer .cart-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #f0f0f0}
#cartDrawer .cart-item-img{width:60px;height:60px;border-radius:8px;overflow:hidden;background:#f3f3f3;flex-shrink:0}
#cartDrawer .cart-item-img img{width:100%;height:100%;object-fit:cover}
#cartDrawer .cart-item-info{flex:1;min-width:0}
#cartDrawer .cart-item-name{font-size:13px;font-weight:600;color:#111;margin-bottom:4px}
#cartDrawer .cart-item-variant{font-size:11px;color:#888;margin-bottom:8px}
#cartDrawer .cart-item-controls{display:flex;align-items:center;justify-content:space-between}
#cartDrawer .cart-item-qty{display:flex;align-items:center;gap:8px}
#cartDrawer .cart-item-qty button{width:24px;height:24px;border:1px solid #e2e2e2;border-radius:4px;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
#cartDrawer .cart-item-qty button:hover{background:#f5f5f5}
#cartDrawer .cart-item-qty span{font-size:13px;font-weight:600;min-width:20px;text-align:center}
#cartDrawer .cart-item-price{font-size:13px;font-weight:700;color:#111}
#cartDrawer .cart-item-remove{width:28px;height:28px;background:none;border:none;cursor:pointer;color:#999;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#cartDrawer .cart-item-remove:hover{color:#e12d2d}
#cartDrawer .cart-footer{padding:16px 20px;border-top:1px solid #ececec;background:#fafafa}
#cartDrawer .cart-total-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;color:#555}
#cartDrawer .cart-total-row.grand{font-size:16px;font-weight:700;color:#111;border-top:1px solid #ddd;padding-top:8px;margin-top:4px}
#cartDrawer .btn-cart-checkout{width:100%;margin-top:12px;padding:14px;background:#111;color:#fff;border:none;border-radius:999px;cursor:pointer;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit}
#cartDrawer .btn-cart-checkout:hover{opacity:.85}

/* Zoom overlay (full-screen image viewer) */
#zoomOverlay{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:99999;display:none;align-items:center;justify-content:center;flex-direction:column}
#zoomOverlay.active{display:flex}
#zoomOverlay img{max-width:90vw;max-height:80vh;object-fit:contain;border-radius:4px}
#zoomOverlay .zoom-counter{color:#fff;font-size:14px;margin-top:16px;font-family:'Inter',sans-serif}
#zoomOverlay .zoom-close{position:absolute;top:20px;right:24px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;border:none;cursor:pointer;font-size:22px;display:flex;align-items:center;justify-content:center}
#zoomOverlay .zoom-close:hover{background:rgba(255,255,255,.25)}
#zoomOverlay .zoom-prev,#zoomOverlay .zoom-next{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
#zoomOverlay .zoom-prev:hover,#zoomOverlay .zoom-next:hover{background:rgba(255,255,255,.25)}
#zoomOverlay .zoom-prev{left:24px}
#zoomOverlay .zoom-next{right:24px}
#zoomOverlay .zoom-prev svg,#zoomOverlay .zoom-next svg{width:20px;height:20px;stroke:#fff}

</style>
</head>
<body>
<!-- Loading screen — shown until store data is ready (prevents flash of default content) -->
<div id="loadingScreen" style="position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;z-index:99999;transition:opacity .3s;">
  <div style="width:40px;height:40px;border:3px solid #eee;border-top-color:#111;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
</div>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>
<div id="app"></div>

<!-- ===== HIDDEN INFRASTRUCTURE for black's backend services ===== -->
<!-- These elements are required by black's JS functions (cart drawer, zoom viewer, toast). -->
<!-- They are HIDDEN by default and only appear on user interaction. -->
<!-- They do NOT modify black-update's existing HTML structure. -->

<!-- Toast notification -->
<div id="toast"><span id="toastMsg"></span></div>

<!-- Cart drawer -->
<div id="cartOverlay"></div>
<div id="cartDrawer">
  <div class="cart-header">
    <h3>Your Cart</h3>
    <button class="cart-close" id="cartClose" aria-label="Close cart">&times;</button>
  </div>
  <div class="cart-body" id="cartBody"></div>
  <div class="cart-footer" id="cartFooter" style="display:none;"></div>
</div>

<!-- Zoom overlay (full-screen image viewer) -->
<div id="zoomOverlay">
  <button class="zoom-close" id="zoomClose" aria-label="Close">&times;</button>
  <button class="zoom-prev" id="zoomPrev" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
  <img id="zoomImage" src="" alt="Zoomed product image">
  <button class="zoom-next" id="zoomNext" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
  <div class="zoom-counter" id="zoomCounter"></div>
</div>

    // 🔒 SECURITY: Server-side price verification.
    // Re-fetch each product from Supabase to get the REAL price/discount/free_shipping,
    // compare against the client-supplied unit_price, and override with the server value
    // if there is any mismatch. This prevents price tampering and fake bot orders.
    // Also re-computes shipping: 0 if ALL items have free_shipping=true, else normal per-wilaya.
    window._shvVerifyOrderPrices = async (payload, storeId, wilayaName, deliveryType) => {
      if (!payload || !Array.isArray(payload.items) || payload.items.length === 0) return payload;
      var verifiedItems = [];
      for (var item of payload.items) {
        var productId = item && item.id ? String(item.id) : '';
        if (!productId) { verifiedItems.push(item); continue; }
        var { data: prodRow, error: prodErr } = await supabase.from('products')
          .select('price,discount_price,free_shipping')
          .eq('store_id', storeId)
          .eq('id', productId)
          .maybeSingle();
        if (prodErr || !prodRow) {
          throw new Error('Product not found: ' + productId);
        }
        var realPrice = (typeof window._effectivePrice === 'function')
          ? window._effectivePrice({ price: Number(prodRow.price) || 0, discountPrice: prodRow.discount_price != null ? Number(prodRow.discount_price) : null })
          : (prodRow.discount_price != null && Number(prodRow.discount_price) > 0 ? Number(prodRow.discount_price) : Number(prodRow.price) || 0);
        var clientPrice = Number(item.unit_price) || 0;
        if (Math.abs(realPrice - clientPrice) > 1) {
          console.warn('Price mismatch detected for product ' + productId, { client: clientPrice, server: realPrice });
          item.unit_price = realPrice;
          item.line_total = realPrice * (Number(item.qty) || 1);
        }
        item.free_shipping = prodRow.free_shipping === true;
        verifiedItems.push(item);
      }
      payload.items = verifiedItems;
      var verifiedSubtotal = verifiedItems.reduce(function(s, i) { return s + (Number(i.line_total) || (Number(i.unit_price) * Number(i.qty))); }, 0);
      if (!payload.pricing) payload.pricing = {};
      payload.pricing.subtotal = verifiedSubtotal;
      payload.subtotal = verifiedSubtotal;
      var allFreeShipping = verifiedItems.every(function(i) { return i.free_shipping === true; });
      var shipping = 0;
      if (!allFreeShipping) {
        shipping = (typeof window.calcShipping === 'function')
          ? window.calcShipping(wilayaName || '', verifiedSubtotal, window._storeData, deliveryType)
          : 0;
      }
      payload.pricing.shipping_fee = shipping;
      payload.shippingCost = shipping;
      payload.pricing.total = verifiedSubtotal + shipping;
      payload.total = verifiedSubtotal + shipping;
      return payload;
    };

    window._shvFetchAllReviewsMap = async (storeId) => {

          .eq('store_id', storeId)
          .order('created_at', { ascending: false })

            comment: r.comment || '',

        return {};

          ttsEnabled: p.tts_enabled === true,
          ttsFee: Number(p.tts_fee) || 0,
        };
      });
      try { localStorage.setItem(cacheKey, JSON.stringify({ store: storeData, products, version: remoteVer })); } catch {}
      return { store: storeData, products };
    };

    // Security utils
    window._shvEscapeHtml = function(str) { return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); };

    window._shvIsRepeatedDigitsPhone = function(phone) {
      // Reject obviously fake phones like 0555555555, 0666666666, 0777777777 (all-same digits after prefix)
      if (!phone) return false;
      var s = String(phone).replace(/\D/g, '');
      if (s.length < 4) return false;
      var tail = s.substring(2); // skip 05/06/07 prefix
      if (!tail.length) return false;
      var first = tail.charAt(0);
      for (var i = 1; i < tail.length; i++) { if (tail.charAt(i) !== first) return false; }
      return true;
    };

    // ===== Reviews / rating helpers =====
    // _shvDefaultReviews is now a no-op — fake reviews were removed. Real reviews come from product_reviews table.
    window._shvDefaultReviews = function (productId) {
      return [];

    // Compute average rating for a product from real reviews only (no fake defaults)
    window._shvProductRating = function (p) {
      if (!p) return 0;
      var rd = Array.isArray(p.reviews_data) ? p.reviews_data : (Array.isArray(p.reviewsData) ? p.reviewsData : []);
      if (rd.length === 0) return 0;
      var sum = 0, n = 0;
      for (var i = 0; i < rd.length; i++) {
        var v = Number(rd[i].rating);
        if (v > 0 && v <= 5) { sum += v; n++; }
      }
      if (n === 0) return 0;
      return Math.round((sum / n) * 10) / 10;
    };
    // Compute review count for a product from real reviews only
    window._shvProductReviewCount = function (p) {
      if (!p) return 0;
      var rd = Array.isArray(p.reviews_data) ? p.reviews_data : (Array.isArray(p.reviewsData) ? p.reviewsData : []);
      return rd.length;

        // by formatting with 'en-US' locale.
        function formatDA(n) {
            var numStr = Number(n).toLocaleString('en-US');
            return currentLang === 'ar' ? (numStr + ' دج') : (numStr + ' DA');
        }

            document.documentElement.lang = lang;
            document.documentElement.dir = dir;

            var btn = document.getElementById('langToggle');

            }

            var btnMobileText = document.getElementById('langToggleMobileText');
            if (btnMobileText) {

            }
            // Re-translate static elements with [data-i18n]
            var els = document.querySelectorAll('[data-i18n]');
            for (var i = 0; i < els.length; i++) {
                var key = els[i].getAttribute('data-i18n');
                els[i].textContent = t(key);
            }
            // Re-translate placeholders
            var phs = document.querySelectorAll('[data-i18n-ph]');
            for (var j = 0; j < phs.length; j++) {
                var pkey = phs[j].getAttribute('data-i18n-ph');

            var ars = document.querySelectorAll('[data-i18n-aria]');

                var akey = ars[k].getAttribute('data-i18n-aria');

        /* ===================== CART ===================== */
        var CART_KEY = 'noir_cart';
        function getCart() { try { return JSON.parse(localStorage.getItem(CART_KEY)) || []; } catch (e) { return []; } }
        function setCart(c) {
            localStorage.setItem(CART_KEY, JSON.stringify(c));
            var total = c.reduce(function (s, i) { return s + i.qty; }, 0);
            var el = document.getElementById('cartCount');
            if (el) el.textContent = total;

        function addToCart(p, size, color, qty) {
            qty = qty || 1;
            size = size || p.sizes[0];
            color = color || p.colors[0].name;
            var cart = getCart();
            var existing = cart.find(function (i) { return i.id === p.id && i.size === size && i.color === color; });
            if (existing) existing.qty += qty;
            else cart.push({ id: p.id, name: p.name, price: p.price, image: p.images[0], size: size, color: color, qty: qty });

            showToast(p.name + ' — ' + t('toast_added'));

            if (typeof window.ShvPixels === 'object') window.ShvPixels.track('AddToCart', { content_ids: [String(p.id)], content_name: p.name, value: window._effectivePrice ? window._effectivePrice(p) : p.price, currency: 'DZD' });
        }

        /* ===================== HELPERS ===================== */
        function buildHref(page, params) {
            // Use query string URLs for SPA navigation (clean URLs handled by worker for SEO)
            var href = '';
            if (page && page !== 'home') {
                href += '?page=' + page;
                if (params) {
                    Object.keys(params).forEach(function (k) {
                        if (params[k] !== null && params[k] !== undefined && params[k] !== '') {
                            href += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
                        }
                    });
                }
            }
            return href;
        }

        function formatPrice(n) { return formatDA(n); }
        function discountPercent(price, original) {
            if (!original || original <= price) return 0;
            return Math.round(((original - price) / original) * 100);
        }
        function showToast(msg) {
            var toast = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            toast.classList.add('show');
            clearTimeout(window.__toastTimer);
            window.__toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 2200);
        }
        function escapeHTML(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
        function highlight(text, q) {
            if (!q) return escapeHTML(text);
            var safe = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            return escapeHTML(text).replace(new RegExp('(' + safe + ')', 'gi'), '<mark class="neon-mark">$1</mark>');
        }
        function renderStars(rating) {
            var full = Math.floor(rating);
            var hasHalf = rating - full >= 0.25 && rating - full < 0.75;
            var empty = 5 - full - (hasHalf ? 1 : 0);
            var html = '';
            var starPath = '<svg fill="currentColor" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>';
            for (var i = 0; i < full; i++) html += starPath;
            if (hasHalf) html += '<svg class="empty" fill="currentColor" viewBox="0 0 24 24"><defs><linearGradient id="halfGrad"><stop offset="50%" stop-color="currentColor"/><stop offset="50%" stop-color="#d1d5db"/></linearGradient></defs><path fill="url(#halfGrad)" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>';
            for (var j = 0; j < empty; j++) html += '<svg class="empty" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>';
            return html;

        /* ===================== ROUTER ===================== */
        function parseURL() {
            var params = new URLSearchParams(window.location.search);
            var page = params.get('page') || 'home';
            var validPages = { home: true, product: true, categories: true, search: true, checkout: true, privacy: true, support: true, about: true, contact: true };
            if (!validPages[page]) page = 'home';
            // Map legacy about/contact → support
            if (page === 'about' || page === 'contact') page = 'support';
            state.page = page;
            state.params = {};
            if (page === 'product') {
                state.params.id = params.get('id');
                state.params.slug = params.get('slug');
            }
            // Support clean URLs: /product/:slug (from template-router-worker)
            var pathMatch = window.location.pathname.match(/^\/product\/(.+)$/);
            if (pathMatch && !state.params.slug && !state.params.id) {
                state.page = 'product';
                state.params = {};
                state.params.slug = decodeURIComponent(pathMatch[1]);
            }
            if (page === 'categories') state.params.cat = params.get('cat') || 'all';
            if (page === 'search') {
                state.params.q = params.get('q') || '';
                state.params.cat = params.get('cat') || 'all';
            }
        }

        function buildURL(page, params) {
            // Clean URLs for product pages: /product/:slug (or /product/:id when no slug)
            if (page === 'product' && params && (params.slug || params.id)) {
                var id = params.slug || params.id;
                var cleanUrl = new URL(window.location.href);
                cleanUrl.search = '';
                cleanUrl.searchParams.set('page', 'product'); cleanUrl.searchParams.set('slug', id);
                return cleanUrl.toString();
            }
            var url = new URL(window.location.href);
            url.search = '';
            if (page && page !== 'home') url.searchParams.set('page', page);
            if (params) {
                Object.keys(params).forEach(function (k) {
                    if (params[k] !== null && params[k] !== undefined && params[k] !== '') {
                        url.searchParams.set(k, params[k]);
                    }
                });
            }
            return url.toString();
        }

        function navigate(page, params, replace) {
            var url = buildURL(page, params);
            if (replace) window.history.replaceState({ page: page, params: params }, '', url);
            else window.history.pushState({ page: page, params: params }, '', url);
            route();
            window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
        }

        function route() {
            parseURL();
            // Hide all pages
            var pages = document.querySelectorAll('.page');
            for (var i = 0; i < pages.length; i++) pages[i].classList.remove('active');
            // Show current page
            var pageEl = document.getElementById('page-' + state.page);
            if (pageEl) pageEl.classList.add('active');
            // Update active nav link
            var navLinks = document.querySelectorAll('.nav-link');
            for (var j = 0; j < navLinks.length; j++) navLinks[j].classList.remove('active');
            var activeNav = document.querySelector('.nav-link[data-nav="' + state.page + '"]');
            if (activeNav) activeNav.classList.add('active');

            // Render the page
            if (state.page === 'home') renderHome();
            else if (state.page === 'product') renderProductPage();
            else if (state.page === 'categories') renderCategoriesPage();
            else if (state.page === 'search') renderSearchPage();
            else if (state.page === 'checkout') renderCheckoutPage();
            else if (state.page === 'privacy') renderPrivacyPage();
            else if (state.page === 'support') renderSupportPage();

            // Re-init icons after every render
            if (window.lucide) lucide.createIcons();
        }

        /* ===================== PRODUCT CARD TEMPLATE ===================== */

            var hasDiscount = p.originalPrice && p.originalPrice > eff;
            var discount = hasDiscount ? discountPercent(eff, p.originalPrice) : discountPercent(p.price, p.originalPrice);
            var tag = '';

            else if (p.badge === 'Best Seller') tag = '<span class="product-tag">' + escapeHTML(t('best_seller')) + '</span>';
            else if (hasDiscount) tag = '<span class="product-tag sale">-' + discount + '%</span>';
            var freeShipBadge = (p.freeShipping === true) ? freeShippingBadgeHTML() : '';
            var nameHTML = opts.highlightQuery ? highlight(p.name, opts.highlightQuery) : escapeHTML(p.name);
            var catHTML = opts.highlightQuery ? highlight(p.categoryLabel, opts.highlightQuery) : escapeHTML(p.categoryLabel);
            // rating count uses Western digits via toFixed and toString (always Latin)
            // Bug 5: use helper-based safe values so Supabase products (which have no rating/reviews columns) still render
            var pRating = (typeof p.rating === 'number' && p.rating > 0) ? p.rating :
                (typeof window._shvProductRating === 'function' ? window._shvProductRating(p) : 4.5);
            var pReviews = (typeof p.reviews === 'number' && p.reviews > 0) ? p.reviews :
                (typeof window._shvProductReviewCount === 'function' ? window._shvProductReviewCount(p) : 0);
            var reviewsStr = Number(pReviews).toString();
            // Use slug when available for SEO-friendly URLs
            var cardParams = p.slug ? '{"slug":"' + escapeHTML(String(p.slug)) + '"}' : '{"id":"' + escapeHTML(String(p.id)) + '"}';
            var cardHref = p.slug ? buildHref('product', { slug: p.slug }) : buildHref('product', { id: p.id });
            return '' +
                '<div class="product-card">' +
                    '<a class="product-image-wrapper" data-nav="product" data-params=\'' + cardParams + '\' href="' + cardHref + '">' +
                        '<div class="product-image-box"><img src="' + p.images[0] + '" alt="' + escapeHTML(p.name) + '" class="product-image"></div>' +
                        tag +
                        freeShipBadge +
                        '<span class="product-quick" data-stop-nav="1"><i data-lucide="heart"></i></span>' +

                    '<div class="product-info">' +
                        '<p class="product-cat">' + catHTML + '</p>' +
                        '<h3 class="product-name"><a data-nav="product" data-params=\'' + cardParams + '\' href="' + cardHref + '">' + nameHTML + '</a></h3>' +
                        (pReviews > 0 ? '<div class="product-rating"><i data-lucide="star" style="fill:currentColor;"></i><span>' + pRating.toFixed(1) + ' (' + reviewsStr + ')</span></div>' : '') +
                        '<div class="product-price-row">' +
                            '<span class="product-price">' + formatPrice(eff) + '</span>' +
                            (hasDiscount ? '<span class="product-price-orig">' + formatPrice(p.originalPrice) + '</span>' : '') +
                        '</div>' +
                        '<button class="btn-add-cart" data-add-product="' + p.id + '">' + escapeHTML(t('add_to_cart')) + '</button>' +
                    '</div>' +
                '</div>';
        }

        // Wire up the review submission form: star rating, char count, submit handler
        function _wireReviewForm(p) {
            var starInput = document.getElementById('reviewStarInput');
            var charInput = document.getElementById('reviewCommentInput');
            var charCount = document.getElementById('reviewCharCount');
            var submitBtn = document.getElementById('submitReviewBtn');
            var msgEl = document.getElementById('reviewFormMsg');
            if (!starInput || !submitBtn || !p) return;

            var selectedRating = 0;
            function paintStars(n) {
                var stars = starInput.querySelectorAll('svg[data-star]');
                for (var i = 0; i < stars.length; i++) {
                    var sn = Number(stars[i].getAttribute('data-star'));
                    if (sn <= n) {
                        stars[i].setAttribute('fill', 'currentColor');
                        stars[i].setAttribute('stroke', 'none');
                        stars[i].style.opacity = '1';
                    } else {
                        stars[i].setAttribute('fill', 'none');
                        stars[i].setAttribute('stroke', 'currentColor');
                        stars[i].style.opacity = '0.4';
                    }
                }
            }
            starInput.addEventListener('mouseover', function(e) {
                var tg = e.target.closest ? e.target.closest('svg[data-star]') : null;
                if (tg) paintStars(Number(tg.getAttribute('data-star')));
            });
            starInput.addEventListener('mouseleave', function() { paintStars(selectedRating); });
            starInput.addEventListener('click', function(e) {
                var tg = e.target.closest ? e.target.closest('svg[data-star]') : null;
                if (tg) { selectedRating = Number(tg.getAttribute('data-star')); starInput.setAttribute('data-rating', String(selectedRating)); paintStars(selectedRating); }
            });

            if (charInput && charCount) {
                charInput.addEventListener('input', function() { charCount.textContent = String(charInput.value.length); });
            }

            submitBtn.addEventListener('click', async function() {
                var nameEl = document.getElementById('reviewNameInput');
                var commentEl = document.getElementById('reviewCommentInput');
                var name = (nameEl && nameEl.value || '').trim();
                var comment = (commentEl && commentEl.value || '').trim();
                if (!name) { if (msgEl) { msgEl.style.color = '#dc2626'; msgEl.textContent = t('rv_name_required'); } return; }
                if (selectedRating < 1) { if (msgEl) { msgEl.style.color = '#dc2626'; msgEl.textContent = t('rv_rating_required'); } return; }
                if (!comment) { if (msgEl) { msgEl.style.color = '#dc2626'; msgEl.textContent = t('rv_comment_required'); } return; }

                var storeId = (window._storeData && window._storeData.id) || window._getStoreId();
                if (!storeId) { if (msgEl) { msgEl.style.color = '#dc2626'; msgEl.textContent = t('rv_error'); } return; }

                var originalText = submitBtn.textContent;
                submitBtn.disabled = true;
                submitBtn.textContent = t('rv_submitting');
                submitBtn.style.opacity = '0.7';
                if (msgEl) { msgEl.style.color = 'var(--color-gray-500)'; msgEl.textContent = ''; }

                try {
                    await window._shvSubmitProductReview(storeId, p.id, name, selectedRating, comment);
                    if (msgEl) { msgEl.style.color = '#86efac'; msgEl.textContent = t('rv_success'); }
                    if (nameEl) nameEl.value = '';
                    if (commentEl) commentEl.value = '';
                    if (charCount) charCount.textContent = '0';
                    selectedRating = 0;
                    starInput.setAttribute('data-rating', '0');
                    paintStars(0);
                    // Refresh the product's reviews from Supabase and re-render the panel
                    if (typeof window._shvRefreshProductReviews === 'function') {
                        var freshReviews = await window._shvRefreshProductReviews(storeId, p.id);
                        if (Array.isArray(freshReviews)) {
                            var adminReviews = Array.isArray(p.reviewsData) ? p.reviewsData : [];
                            var freshSet = {};
                            for (var i = 0; i < freshReviews.length; i++) {
                                var key = (freshReviews[i].name || '') + '|' + (freshReviews[i].comment || '');
                                freshSet[key] = true;
                            }
                            var extra = [];
                            for (var j = 0; j < adminReviews.length; j++) {
                                var k = (adminReviews[j].name || '') + '|' + (adminReviews[j].comment || '');
                                if (!freshSet[k]) extra.push(adminReviews[j]);
                            }
                            p.reviewsData = freshReviews.concat(extra);
                            p.rating = window._shvProductRating(p);
                            p.reviews = window._shvProductReviewCount(p);
                        }
                    }
                    renderReviewsPanel(p, p.rating, p.reviews);
                } catch(err) {
                    if (msgEl) { msgEl.style.color = '#dc2626'; msgEl.textContent = (err && err.message) ? err.message : t('rv_error'); }
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = originalText;
                    submitBtn.style.opacity = '1';
                }
            });
        }

        /* ===================== DIRECT ORDER CARD ===================== */
        function renderOrderSummary(p) {
            var card = document.getElementById('orderSummaryCard');
            if (!card || !p) return;

            var qty = state.quantity || 1;
            var effUnit = window._effectivePrice ? window._effectivePrice(p) : p.price;
            var subtotal = effUnit * qty;
            var hasDiscountOS = p.originalPrice && p.originalPrice > effUnit;
            var savings = hasDiscountOS ? (p.originalPrice - effUnit) * qty : 0;
            var d = state.checkoutData || {};
            var deliveryType = d.deliveryType || 'home';
            // 🚚 Free shipping: if this product has freeShipping=true, shipping = 0 regardless of wilaya/subtotal
            var isFreeShipping = (p.freeShipping === true);
            var shipping = isFreeShipping ? 0 : calcShipping(d.wilaya || '', subtotal, window._storeData, deliveryType);
            // Try Two Sizes (TTS) — only available when store enables it AND product has ≥2 sizes AND price ≥ ttsMinPrice
            var ttsAvailable = !!(window._storeData && window._storeData.ttsEnabled === true
                                && p.sizes && p.sizes.length >= 2

        function bindOrderFormInteractions(p) {
            // Qty controls (sync with main product page)
            var osMinus = document.getElementById('osQtyMinus');
            var osPlus = document.getElementById('osQtyPlus');
            if (osMinus) osMinus.addEventListener('click', function () {
                if (state.quantity > 1) {
                    state.quantity--;
                    var mainInput = document.getElementById('qtyInput');
                    if (mainInput) mainInput.value = state.quantity;
                    saveFormFields();
                    renderOrderSummary(p);
                }
            });
            if (osPlus) osPlus.addEventListener('click', function () {
                if (state.quantity < 10) {
                    state.quantity++;
                    var mainInput = document.getElementById('qtyInput');
                    if (mainInput) mainInput.value = state.quantity;
                    saveFormFields();
                    renderOrderSummary(p);
                }
            });

            // Wilaya change → recompute shipping + totals live
            var coWilayaEl = document.getElementById('coWilaya');
            if (coWilayaEl) coWilayaEl.addEventListener('change', function () {
                saveFormFields();
                if (state.product) renderOrderSummary(state.product);
            });

            // Delivery type buttons (home / office) → recompute shipping + totals
            // NOTE: use document (not `card`) — `card` is not in scope inside this function.
            var coDeliveryBtns = document.querySelectorAll('#coDeliveryType .delivery-type-btn');
            coDeliveryBtns.forEach(function (btn) {
                if (btn.__shvBound) return;
                btn.__shvBound = true;
                btn.addEventListener('click', function () {
                    coDeliveryBtns.forEach(function (b) { b.classList.remove('active'); });
                    btn.classList.add('active');
                    saveFormFields();
                    if (state.product) renderOrderSummary(state.product);
                });
            });

            // TTS toggle (Try Two Sizes) — flip state.ttsEnabled and re-render
            var coTtsToggle = document.getElementById('coTtsToggle');
            if (coTtsToggle && !coTtsToggle.__shvBound) {
                coTtsToggle.__shvBound = true;
                coTtsToggle.addEventListener('click', function (e) {
                    if (e.target.closest('.tts-size-btn')) return;
                    state.ttsEnabled = !state.ttsEnabled;
                    if (!state.ttsEnabled) state.ttsBackupSize = '';
                    saveFormFields();
                    if (state.product) renderOrderSummary(state.product);
                });
            }

            // TTS backup size buttons
            var coTtsSizeBtns = document.querySelectorAll('#coTtsSizeRow .tts-size-btn');
            coTtsSizeBtns.forEach(function (btn) {
                if (btn.__shvBound || btn.disabled) return;
                btn.__shvBound = true;
                btn.addEventListener('click', function () {
                    state.ttsBackupSize = btn.getAttribute('data-tts-size') || '';
                    saveFormFields();
                    if (state.product) renderOrderSummary(state.product);
                });
            });

            // Submit button
            var submitBtn = document.getElementById('osSubmitBtn');
            if (submitBtn) submitBtn.addEventListener('click', async function () {
                saveFormFields();
                // 🔒 Honeypot anti-spam check — check BOTH hidden fields
                var hpCo = document.getElementById('shv_hp_co');
                var hpCo2 = document.getElementById('shv_hp_co_phone');
                if ((hpCo && hpCo.value) || (hpCo2 && hpCo2.value)) { showToast(t('of_required')); return; }
                // 🔒 Increased from 3s to 5s minimum page load time (block instant bot submissions)
                if (typeof window._SHV_PAGE_LOAD_TS !== 'undefined' && Date.now() - window._SHV_PAGE_LOAD_TS < 5000) { showToast(t('of_required')); return; }
                // 🔒 Fast-submit check: <1s after first field focus = bot
                if (window._SHV_FIRST_FOCUS_TS && Date.now() - window._SHV_FIRST_FOCUS_TS < 1000) { showToast(t('of_required')); return; }
                // 🔒 Rate limit
                if (typeof window._shvCheckRateLimit === 'function') {
                    var _rl = window._shvCheckRateLimit();
                    if (_rl > 0) { showToast(t('of_required')); return; }
                }
                var d = state.checkoutData;
                if (!d.fullName || !d.phone || !d.wilaya || !d.baladiya || !d.address) {
                    showToast(t('of_required'));
                    return;
                }
                // 🔒 Phone validation (Algerian format: 05/06/07 + 8 digits)
                if (!/^0[5-7]\d{8}$/.test(d.phone)) {
                    showToast(t('of_required'));
                    return;
                }
                // 🔒 Reject obviously fake phones (all-same digits after prefix)
                if (typeof window._shvIsRepeatedDigitsPhone === 'function' && window._shvIsRepeatedDigitsPhone(d.phone)) {
                    showToast(t('of_required'));
                    return;
                }
                if (!state.selectedSize) {
                    showToast(t('toast_select_size'));
                    return;
                }
                // Bug 3: actually submit the order to Supabase (previously this just added to cart + showed a toast)
                try {
                    var qty = state.quantity || 1;
                    var unitPrice = window._effectivePrice ? window._effectivePrice(p) : (p.discountPrice || p.price);
                    var subtotal = unitPrice * qty;
                    var deliveryType = d.deliveryType || 'home';
                    var isFreeShipping = (p.freeShipping === true);
                    var shipping = isFreeShipping ? 0 : calcShipping(d.wilaya || '', subtotal, window._storeData, deliveryType);
                    // Try Two Sizes (TTS) — recompute fee + validation in submit handler
                    var ttsAvailable = !!(window._storeData && window._storeData.ttsEnabled === true
                                        && p.sizes && p.sizes.length >= 2
                                        && unitPrice >= (Number(window._storeData.ttsMinPrice) || 0));
                    var ttsEnabled = ttsAvailable && state.ttsEnabled === true;
                    var ttsFee = ttsEnabled ? (Number(p.ttsFee || (window._storeData && window._storeData.ttsDefaultFee)) || 0) : 0;
                    var ttsBackupSize = ttsEnabled ? (state.ttsBackupSize || '') : '';
                    // If TTS enabled but no backup size selected, prompt user to pick one
                    if (ttsEnabled && !ttsBackupSize) {
                        showToast(t('tts_backup_label'));
                        submitBtn.disabled = false; submitBtn.textContent = t('of_submit');
                        return;
                    }
                    var total = subtotal + shipping + ttsFee;
                    var payload = {
                        customer: { name: d.fullName, phone: d.phone, wilaya: d.wilaya, commune: d.baladiya, address: d.address, delivery_type: deliveryType, notes: d.notes || '' },
                        items: [{ id: p.id, name: p.name, qty: qty, unit_price: unitPrice, line_total: subtotal, size: state.selectedSize, color: (p.colors[state.selectedColor||0]||{}).name || null, free_shipping: isFreeShipping }],
                        pricing: { subtotal: subtotal, shipping_fee: shipping, tts_fee: ttsFee, total: total, currency: 'DZD' },
                        note: d.notes || null,
                        try_two_sizes: ttsEnabled,
                        tts_backup_size: ttsEnabled ? ttsBackupSize : null,
                    };
                    submitBtn.disabled = true; submitBtn.textContent = '...';
                    // 🔒 Server-side price verification before sending the order
                    if (typeof window._shvVerifyOrderPrices === 'function') {
                        try { payload = await window._shvVerifyOrderPrices(payload, (window._storeData && window._storeData.id) || window._getStoreId(), d.wilaya, deliveryType); }
                        catch (verr) {
                            showToast(t('of_required') + ': ' + (verr.message || ''));
                            submitBtn.disabled = false; submitBtn.textContent = t('of_submit');
                            return;
                        }
                        subtotal = payload.pricing.subtotal;
                        shipping = payload.pricing.shipping_fee;
                        total = payload.pricing.total;
                    }
                    if (typeof window.saveOrderToFirestore === 'function') {
                        var orderId = await window.saveOrderToFirestore(payload);
                        if (typeof window._shvStampSubmit === 'function') window._shvStampSubmit();
                        if (typeof window.ShvPixels === 'object') window.ShvPixels.track('Purchase', { content_ids: [String(p.id)], value: total, currency: 'DZD', num_items: qty });
                    }
                    // Reset form
                    state.checkoutData = { fullName: '', phone: '', wilaya: '', baladiya: '', address: '', notes: '', deliveryType: 'home' };
                    state.ttsEnabled = false; state.ttsBackupSize = '';
                    showToast(t('of_order_success'));
                    // Redirect to home after 2 seconds
                    setTimeout(function () { navigate('home', {}); }, 2000);
                } catch (e) {
                    showToast(t('of_required') + ': ' + (e.message || ''));
                    console.error('Direct order error:', e);
                } finally {
                    submitBtn.disabled = false; submitBtn.textContent = t('of_submit');
                }
            });
        }

        /* ===================== IMAGE ZOOM VIEWER ===================== */
        function openZoomViewer(index) {
            var p = state.product;
            if (!p || !p.images || p.images.length === 0) return;
            var overlay = document.getElementById('zoomOverlay');
            var img = document.getElementById('zoomImage');
            var counter = document.getElementById('zoomCounter');
            if (!overlay || !img) return;
            img.src = p.images[index];
            state.zoomIndex = index;
            if (counter) counter.textContent = (index + 1) + ' / ' + p.images.length;
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        function closeZoomViewer() {
            var overlay = document.getElementById('zoomOverlay');
            if (!overlay) return;
            overlay.classList.remove('active');
            document.body.style.overflow = '';
        }
        function zoomNext() {
            var p = state.product;
            if (!p) return;
            var next = (state.zoomIndex + 1) % p.images.length;
            openZoomViewer(next);
        }
        function zoomPrev() {
            var p = state.product;
            if (!p) return;
            var prev = (state.zoomIndex - 1 + p.images.length) % p.images.length;
            openZoomViewer(prev);
        }

        function renderSearchPills() {
            var all = [{ id: 'all', name: t('cat_all') }].concat(NEON_DATA.categories);
            var html = all.map(function (cat) {
                var base = cat.id === 'all' ? NEON_DATA.products : NEON_DATA.getProductsByCategory(cat.id);
                var filtered = state.searchQuery ? base.filter(function (p) { return matchesQuery(p, state.searchQuery); }) : base;
                return '<button class="filter-pill' + (cat.id === state.searchActive ? ' active' : '') + '" data-cat="' + cat.id + '">' + escapeHTML(cat.name) + '<span class="count">' + filtered.length + '</span></button>';
            }).join('');

                b.addEventListener('click', function () {
                    state.searchActive = b.dataset.cat;
                    navigate('search', { q: state.searchQuery, cat: state.searchActive });
                });
            });

        function matchesQuery(p, q) {
            if (!q) return true;
            q = q.trim().toLowerCase();
            if (!q) return true;
            var cat = NEON_DATA.getCategoryById(p.category);
            var haystack = [p.name, p.shortDesc, p.categoryLabel, cat ? cat.name : '', p.badge, p.details.join(' '), p.colors.map(function (c) { return c.name; }).join(' ')].join(' ').toLowerCase();
            return haystack.indexOf(q) !== -1;
        }

        function renderSearchResults() {
            var grid = document.getElementById('searchResultsGrid');

            document.getElementById('recentGrid').innerHTML = trending.map(function (p) {

                var tHref = p.slug ? buildHref('product', { slug: p.slug }) : buildHref('product', { id: p.id });
                return '' +

            }).join('');

        /* ===================== SORT HELPER ===================== */
        function sortProducts(arr, sort) {
            var sorted = arr.slice();
            switch (sort) {
                case 'price-asc': sorted.sort(function (a, b) { return a.price - b.price; }); break;
                case 'price-desc': sorted.sort(function (a, b) { return b.price - a.price; }); break;
                case 'rating': sorted.sort(function (a, b) { return b.rating - a.rating; }); break;
                case 'newest': sorted.sort(function (a, b) { return (b.isNew ? 1 : 0) - (a.isNew ? 1 : 0); }); break;
            }
            return sorted;
        }

                        '<div class="ck-item" data-ck-idx="' + idx + '">' +

                                '<div class="ck-item-bottom">' +

        /* ===================== GLOBAL CLICK DELEGATION (router links) ===================== */
        function bindGlobalClicks() {
            // 🔒 Track first focus on any form field (used to detect bot-style instant submissions)
            if (!window._SHV_FIRST_FOCUS_TS) {
                document.addEventListener('focusin', function() {
                    if (!window._SHV_FIRST_FOCUS_TS) window._SHV_FIRST_FOCUS_TS = Date.now();
                }, true);
            }
            document.addEventListener('click', function (e) {
                // Find closest [data-nav]
                var target = e.target.closest('[data-nav]');
                if (!target) return;
                if (target.hasAttribute('data-stop-nav')) return;
                // If it's a button inside a link, let the link handle navigation
                if (e.target.closest('[data-add-product]')) return;
                e.preventDefault();
                e.stopPropagation();
                var page = target.getAttribute('data-nav');
                if (page === 'about' || page === 'contact') {
                    page = 'support';
                }
                if (page === 'cart') {
                    openCart();
                    return;
                }
                var paramsStr = target.getAttribute('data-params');
                var params = null;
                if (paramsStr) {
                    try { params = JSON.parse(paramsStr); } catch (err) { params = null; }
                }
                navigate(page, params || {});
            });

            // Sort selects
            var catSort = document.getElementById('catSortSelect');
            catSort.addEventListener('change', function () {
                state.catSort = catSort.value;
                renderCatProducts();
            });
            var searchSort = document.getElementById('searchSortSelect');
            searchSort.addEventListener('change', function () {
                state.searchSort = searchSort.value;
                renderSearchResults();
            });

            // Search input (live debounce)
            var searchInput = document.getElementById('searchInput');
            var searchClear = document.getElementById('searchClear');
            var searchForm = document.getElementById('searchForm');
            var searchDebounce;
            searchInput.addEventListener('input', function () {
                state.searchQuery = searchInput.value;
                searchClear.classList.toggle('show', !!searchInput.value);
                clearTimeout(searchDebounce);
                searchDebounce = setTimeout(function () {
                    // Update URL + re-render results without full route (smoother)
                    var newURL = buildURL('search', { q: state.searchQuery, cat: state.searchActive });
                    window.history.replaceState({ page: 'search', params: { q: state.searchQuery, cat: state.searchActive } }, '', newURL);
                    renderSearchPills();
                    renderSearchResults();
                    if (window.lucide) lucide.createIcons();
                }, 250);
            });
            searchForm.addEventListener('submit', function (e) {
                e.preventDefault();
                state.searchQuery = searchInput.value;
                navigate('search', { q: state.searchQuery, cat: state.searchActive });
            });
            searchClear.addEventListener('click', function () {
                searchInput.value = '';
                state.searchQuery = '';
                searchClear.classList.remove('show');
                navigate('search', { q: '', cat: 'all' });
                searchInput.focus();
            });

            // Suggestion chips
            var chips = document.querySelectorAll('.suggestion-chip');
            chips.forEach(function (chip) {
                chip.addEventListener('click', function () {
                    navigate('search', { q: chip.dataset.q, cat: 'all' });
                    window.scrollTo({ top: 400, behavior: 'smooth' });
                });
            });

            // Pagination dots (home) - visual only
            var dots = document.querySelectorAll('.dot');
            dots.forEach(function (d, i) {
                d.addEventListener('click', function () {
                    dots.forEach(function (x) { x.classList.remove('active'); });
                    d.classList.add('active');
                });
            });
        }

        function closeCart() {

        function renderCart() {
            var body = document.getElementById('cartBody');
            var footer = document.getElementById('cartFooter');
            if (!body || !footer) return;
            var cart = getCart();
            if (cart.length === 0) {
                body.innerHTML =
                    '<div class="cart-empty">' +
                        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>' +
                        '<h4>' + escapeHTML(t('cart_empty')) + '</h4>' +
                        '<p>' + escapeHTML(t('cart_empty_desc')) + '</p>' +
                    '</div>';
                footer.style.display = 'none';
                return;
            }
            var subtotal = cart.reduce(function (s, i) { return s + (i.price * i.qty); }, 0);
            // 🚚 Free shipping: if ALL cart items have freeShipping=true, shipping = 0
            var _allFreeCart = cart.every(function(it) {
                if (it.freeShipping === true) return true;
                if (it.id && typeof NEON_DATA !== 'undefined' && Array.isArray(NEON_DATA.products)) {
                    var p = NEON_DATA.products.find(function(x) { return String(x.id) === String(it.id); });
                    if (p && p.freeShipping === true) return true;
                }
                return false;
            });
            var shipping = _allFreeCart ? 0 : calcShipping('', subtotal, window._storeData);
            var total = subtotal + shipping;
            body.innerHTML = cart.map(function (item, idx) {
                return '' +
                    '<div class="cart-item" data-cart-idx="' + idx + '">' +
                        '<div class="cart-item-img"><img src="' + item.image + '" alt="' + escapeHTML(item.name) + '"></div>' +
                        '<div class="cart-item-info">' +
                            '<div class="cart-item-name">' + escapeHTML(item.name) + '</div>' +
                            '<div class="cart-item-variant">' + escapeHTML(t('os_color')) + ': ' + escapeHTML(item.color) + ' • ' + escapeHTML(t('os_size')) + ': ' + escapeHTML(item.size) + '</div>' +
                            '<div class="cart-item-controls">' +
                                '<div class="cart-item-qty">' +
                                    '<button data-cart-action="dec" data-idx="' + idx + '" aria-label="Decrease"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px;"><line x1="5" y1="12" x2="19" y2="12"/></svg></button>' +
                                    '<span>' + item.qty + '</span>' +
                                    '<button data-cart-action="inc" data-idx="' + idx + '" aria-label="Increase"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px;"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>' +
                                '</div>' +
                                '<span class="cart-item-price">' + formatPrice(item.price * item.qty) + '</span>' +
                            '</div>' +
                        '</div>' +
                        '<button class="cart-item-remove" data-cart-action="rm" data-idx="' + idx + '" aria-label="' + escapeHTML(t('cart_remove')) + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>' +
                    '</div>';
            }).join('');
            footer.style.display = 'block';
            footer.innerHTML =
                '<div class="cart-total-row"><span class="label">' + escapeHTML(t('cart_subtotal')) + '</span><span class="value">' + formatPrice(subtotal) + '</span></div>' +
                '<div class="cart-total-row"><span class="label">' + escapeHTML(t('cart_shipping')) + '</span><span class="value">' + (shipping === 0 ? escapeHTML(t('cart_free')) : formatPrice(shipping)) + '</span></div>' +
                '<div class="cart-total-row grand"><span class="label">' + escapeHTML(t('cart_total')) + '</span><span class="value">' + formatPrice(total) + '</span></div>' +
                '<button class="btn-cart-checkout" id="cartCheckoutBtn">' +
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>' +
                    escapeHTML(t('cart_checkout')) +
                '</button>';
            // Bind cart item actions
            body.querySelectorAll('[data-cart-action]').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    var idx = parseInt(btn.dataset.idx, 10);
                    var action = btn.dataset.cartAction;
                    var cart = getCart();
                    if (!cart[idx]) return;
                    if (action === 'inc') cart[idx].qty++;
                    else if (action === 'dec') { if (cart[idx].qty > 1) cart[idx].qty--; else cart.splice(idx, 1); }
                    else if (action === 'rm') cart.splice(idx, 1);
                    setCart(cart);
                    renderCart();
                });
            });
            var checkoutBtn = document.getElementById('cartCheckoutBtn');
            if (checkoutBtn) checkoutBtn.addEventListener('click', function () {
                closeCart();
                navigate('checkout', {});
                setTimeout(function () {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }, 100);
            });

        function applyHeroSettings(s) {
            if (!s) return;
            // 🔒 SECURITY: validate cover_image URL scheme — only allow https: (and data:image/)
            var safeCover = '';
            if (s.coverImage && typeof s.coverImage === 'string') {
                var cov = String(s.coverImage).trim();
                if (/^https:\/\//i.test(cov) || /^data:image\//i.test(cov)) {
                    safeCover = cov;
                }
            }
            // Hero image (NOIR uses an <img class="hero-image">)
            if (safeCover) {
                var heroImg = document.getElementById('heroImage');
                if (heroImg) {
                    heroImg.src = safeCover;
                    heroImg.alt = (s.name || 'NOIR') + ' — Hero';
                }
            }
            // Hero description
            if (s.heroDesc) {
                var hd = document.getElementById('heroSubtitle');
                if (hd) hd.textContent = s.heroDesc;
            }
            // Hero kicker (badge) from heroKicker — falls back to store name uppercased
            var kickerText = s.heroKicker || (s.name ? s.name.toUpperCase() : null);
            if (kickerText) {
                var hb = document.getElementById('heroBadge');
                if (hb) hb.textContent = kickerText;
            }
            // Hero title — composed from heroTitle1 + heroTitle2 (with <br> between),
            // OR fall back to s.title (pipe-delimited).
            var ht = document.getElementById('heroTitle');
            if (ht) {
                if (s.heroTitle1 || s.heroTitle2) {
                    var line1 = escapeHTML(s.heroTitle1 || '');
                    var line2 = escapeHTML(s.heroTitle2 || '');
                    ht.innerHTML = '<span>' + line1 + '</span>' + (line2 ? '<br><span>' + line2 + '</span>' : '');
                } else if (s.title) {
                    ht.innerHTML = escapeHTML(s.title).replace(/\|/g, '<br>');
                }
            }
            // Hero button text from heroBtn (overrides i18n default)
            if (s.heroBtn) {
                var hbtn = document.querySelector('.btn-primary[data-i18n="hero_cta"]');
                if (hbtn) hbtn.textContent = s.heroBtn;
            }
        }

            // This prevents the visible "flash" where the default hero/cover/name shows
            // first and then the real store customization appears once Supabase returns.
            var _cachedStoreId = window._getStoreId();
            if (_cachedStoreId) {
                try {
                    var _cacheKey = 'shv_store_' + _cachedStoreId.trim();
                    var _cachedRaw = localStorage.getItem(_cacheKey);
                    if (_cachedRaw) {
                        var _cachedParsed = JSON.parse(_cachedRaw);
                        if (_cachedParsed && _cachedParsed.store) {
                            var _cs = _cachedParsed.store;
                            window._storeData = _cs;
                            if (_cs.name) {
                                var _cLogo = document.querySelector('.logo');
                                if (_cLogo) _cLogo.textContent = _cs.name;
                                var _cFooterLogo = document.querySelector('.footer-logo a');
                                if (_cFooterLogo) _cFooterLogo.textContent = _cs.name;
                                document.title = (_cs.title || _cs.name) + ' | NOIR';
                            }

                            if (_cs.tiktok)    { var _tk = document.getElementById('socialTiktok');    if (_tk) { _tk.href = _cs.tiktok;    _tk.style.display = ''; } }
                            if (_cs.facebook)  { var _fb = document.getElementById('socialFacebook');  if (_fb) { _fb.href = _cs.facebook;  _fb.style.display = ''; } }
                            applyHeroSettings(_cs);
                        }
                    }
                } catch(e) { /* ignore cache errors */ }
            }

            // ── جلب بيانات المتجر من Supabase ──
            var storeId = window._getStoreId();
            if (storeId && typeof window.fetchStoreFromFirestore === 'function') {
                try {
                    var result = await window.fetchStoreFromFirestore(storeId);
                    if (result.store) {
                        var s = result.store;
                        // تطبيق اسم المتجر على الـ logo والعنوان
                        var logoEl = document.querySelector('.logo');
                        if (logoEl && s.name) logoEl.textContent = s.name;
                        var footerLogo = document.querySelector('.footer-logo a');
                        if (footerLogo && s.name) footerLogo.textContent = s.name;
                        if (s.name || s.title) document.title = (s.title || s.name) + ' | NOIR';
                        // تطبيق الروابط الاجتماعية
                        if (s.instagram) { var ig = document.getElementById('socialInstagram'); if (ig) { ig.href = s.instagram; ig.style.display = ''; } }
                        if (s.tiktok) { var tk = document.getElementById('socialTiktok'); if (tk) { tk.href = s.tiktok; tk.style.display = ''; } }
                        if (s.facebook) { var fb = document.getElementById('socialFacebook'); if (fb) { fb.href = s.facebook; fb.style.display = ''; } }
                        // Apply hero customization (cover image / title / desc / kicker)
                        applyHeroSettings(s);
                        // Persist store snapshot to localStorage for instant application on next load
                        try { localStorage.setItem('shv_store_' + storeId.trim(), JSON.stringify({ store: s, products: result.products || [], version: String(s.updatedAt?.seconds ?? 0) })); } catch(ee) {}
                        // إعداد البكسل
                        if (typeof window.ShvPixels === 'object') window.ShvPixels.init(s);
                    }
                    if (result.products && result.products.length > 0) {
                        // استبدال البيانات الثابتة ببيانات Supabase
                        NEON_DATA.products = result.products.map(function(p, i) {

                                category: p.category || 'general',

                                badge: p.badge || (p.discountPrice > 0 ? 'Sale' : ''),

                                colors: p.colors || [],

                                details: Array.isArray(p.details) ? p.details : (p.details ? [String(p.details)] : ['Quality product']),
                                materials: p.materials || 'Premium materials.',
                                sizeFit: p.sizeFit || 'Standard fit.',
                                shipping: p.shipping || 'Free shipping on orders above 5,000 DA across Algeria. Delivery in 3-5 business days.',
                                shippingReturns: p.shippingReturns || '',
                                reviewsText: p.reviewsText || '',
                                reviewsData: Array.isArray(p.reviewsData) ? p.reviewsData : [],
                                slug: p.slug || '',
                                freeShipping: p.freeShipping === true,
                            };
                        });
                        // بناء الفئات من المنتجات
                        var catMap = {};
                        NEON_DATA.products.forEach(function(p) {
                            if (p.category && !catMap[p.category]) {
                                catMap[p.category] = { id: p.category, name: p.categoryLabel || p.category, blurb: '', image: p.images && p.images[0] ? p.images[0] : '' };

                    // Realtime subscription
                    if (typeof window.subscribeToStoreProducts === 'function') {
                        window.subscribeToStoreProducts(storeId, function(products) {
                            if (!products || !products.length) return;
