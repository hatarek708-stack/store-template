                                return {
                                    id: p.id || (i + 1), name: p.name || '', category: p.category || 'general',
                                    categoryLabel: p.category || 'General', price: p.price || 0,
                                    discountPrice: p.discountPrice || null,
                                    originalPrice: p.originalPrice || null, rating: (typeof window._shvProductRating === 'function') ? window._shvProductRating(p) : (p.rating || 4.8), reviews: (typeof window._shvProductReviewCount === 'function') ? window._shvProductReviewCount(p) : (p.reviews || 100),
                                    badge: p.badge || '', isNew: false,

            // Apply saved language (set html lang/dir, translate static text, re-render)
            setLanguage(currentLang);

        function bindZoomViewer() {
            var overlay = document.getElementById('zoomOverlay');

            var prevBtn = document.getElementById('zoomPrev');
            var nextBtn = document.getElementById('zoomNext');
            if (overlay) {
                overlay.addEventListener('click', function (e) {
                    if (e.target === overlay) closeZoomViewer();
                });
            }
            if (closeBtn) closeBtn.addEventListener('click', closeZoomViewer);
            if (prevBtn) prevBtn.addEventListener('click', function (e) { e.stopPropagation(); zoomPrev(); });
            if (nextBtn) nextBtn.addEventListener('click', function (e) { e.stopPropagation(); zoomNext(); });
            // Keyboard navigation
            document.addEventListener('keydown', function (e) {
                if (!overlay || !overlay.classList.contains('active')) return;
                if (e.key === 'Escape') closeZoomViewer();
                else if (e.key === 'ArrowLeft') zoomPrev();
                else if (e.key === 'ArrowRight') zoomNext();
            });
        }

        };
        var starSVG = function(s) { return '<svg viewBox="0 0 24 24" width="'+s+'" height="'+s+'" fill="currentColor"><path d="M12 2.8l2.8 6 6.6.6-5 4.4 1.5 6.5-5.9-3.4-5.9 3.4 1.5-6.5-5-4.4 6.6-.6z"/></svg>'; };

          var h = '';
          for (var i = 1; i <= 5; i++) {

            h += '<span class="star" style="width:' + size + 'px;height:' + size + 'px;color:#e3e3e3">' + starSVG(size) + '<span class="star-clip" style="width:' + f + '%;color:' + color + '">' + starSVG(size) + '</span></span>';
          }

        }

        /* ---------- 3. FALLBACK IMAGE URLs (used ONLY when no Supabase data) ---------- */

        /* ---------- 5. PRICE FORMATTER (uses black's formatDA → DA/dj) ---------- */
        function formatProductPrice(n) {
          // Use black's formatDA which respects language (DA in EN, dj in AR)
          if (typeof formatDA === 'function') return formatDA(n);

        /* ---------- 6. DATA ADAPTER (maps NEON_DATA + store → view format) ---------- */
        var DATA = {

              var eff = (typeof window._effectivePrice === 'function') ? window._effectivePrice(p) : p.price;

              else if (p.badge === 'New Arrival') badge = t('new_arrival');
              else if (p.badge === 'Thrift Pick') badge = t('thrift_pick');
              else if (p.badge) badge = p.badge;
              else if (p.originalPrice && p.originalPrice > eff) badge = 'Sale';
              return {
                id: String(p.id),
                name: p.name || 'Product',
                price: eff,
                img: (p.images && p.images[0]) ? p.images[0] : (p.image || FALLBACK_IMG.product),

          get collections() {
            var defaultCols = [

              {name:'Accessories',img:FALLBACK_IMG.product,h:250},

            if (!NEON_DATA || !NEON_DATA.categories || !NEON_DATA.categories.length) {
              return defaultCols;

              return {

                h: (i % 3 === 1 || i % 3 === 2) ? 410 : 250,
                extra: (i === 1)
              };
            });
            var idx = 0;
            while (cols.length < 6 && NEON_DATA.categories.length > 0) {
              var src = NEON_DATA.categories[idx % NEON_DATA.categories.length];
              cols.push({
                name: src.name + ' ' + (cols.length + 1),
                img: src.image || FALLBACK_IMG.product,
                h: (cols.length % 3 === 1 || cols.length % 3 === 2) ? 410 : 250,
                extra: false

              idx++;
            }
            return cols.length >= 6 ? cols : defaultCols;
          },
          get product() {
            var p = state.product;
            if (!p && NEON_DATA && NEON_DATA.products && NEON_DATA.products.length) {
              p = NEON_DATA.products[0];
              state.product = p;
            }
            if (!p) {
              return {
                name: 'Product', rating: 4.5, reviews: 0, price: 0, oldPrice: 0,
                desc: '', colors: [{name:'Default', hex:'#333'}],
                thumbs: [FALLBACK_IMG.product], bullets: [],
                sizes: [], details: [], materials: '', sizeFit: '', shippingReturns: '',
                shortDesc: '', reviewsText: '', reviewsData: [],
                freeShipping: false, discountPrice: null, originalPrice: null
              };
            }
            var eff = (typeof window._effectivePrice === 'function') ? window._effectivePrice(p) : p.price;
            var hasDiscount = p.originalPrice && p.originalPrice > eff;
            var rating = (typeof p.rating === 'number' && p.rating > 0) ? p.rating :
                         (typeof window._shvProductRating === 'function' ? window._shvProductRating(p) : 0);
            var reviews = (typeof p.reviews === 'number' && p.reviews > 0) ? p.reviews :
                          (typeof window._shvProductReviewCount === 'function' ? window._shvProductReviewCount(p) : 0);
            var colors = (p.colors && p.colors.length) ? p.colors.map(function(c) {
              if (typeof c === 'string') return { name: c, hex: c };
              return { name: c.name || c.hex || 'Color', hex: c.hex || c.name || '#333' };
            }) : [{name:'Default', hex:'#333'}];
            var thumbs = (p.images && p.images.length) ? p.images : [p.image || FALLBACK_IMG.product];
            var bullets = (p.details && p.details.length) ? p.details : [];
            return {
              name: p.name,
              rating: rating,
              reviews: reviews,
              price: eff,
              oldPrice: hasDiscount ? p.originalPrice : null,
              desc: p.shortDesc || p.desc || '',
              colors: colors,
              thumbs: thumbs,
              bullets: bullets,
              sizes: p.sizes || [],
              details: p.details || [],
              materials: p.materials || '',
              sizeFit: p.sizeFit || '',
              shippingReturns: p.shippingReturns || '',
              shortDesc: p.shortDesc || p.desc || '',
              reviewsText: p.reviewsText || '',
              reviewsData: p.reviewsData || [],
              freeShipping: p.freeShipping === true,
              discountPrice: p.discountPrice || null,
              originalPrice: p.originalPrice || null,
              _raw: p
            };
          },
          get reviewsList() {
            var p = state.product;
            if (!p || !p.reviewsData || !p.reviewsData.length) {
              return [];
            }
            return p.reviewsData.map(function(r) {
              var comment = r.comment || '';
              return {
                stars: Math.max(1, Math.min(5, Math.floor(Number(r.rating) || 5))),
                date: r.date || 'recently',
                title: comment ? (comment.substring(0, 40) + (comment.length > 40 ? '...' : '')) : 'Review',
                text: comment,
                author: r.name || 'Anonymous'
              };
            });
          },
          get bars() {
            // Calculate bars from real reviews
            var p = state.product;
            if (p && p.reviewsData && p.reviewsData.length) {
              var counts = [0,0,0,0,0,0]; // index 1-5
              p.reviewsData.forEach(function(r) {
                var v = Math.floor(Number(r.rating) || 0);
                if (v >= 1 && v <= 5) counts[v]++;
              });
              var total = p.reviewsData.length;
              if (total > 0) {
                return [[5, Math.round(counts[5]/total*100)], [4, Math.round(counts[4]/total*100)],
                        [3, Math.round(counts[3]/total*100)], [2, Math.round(counts[2]/total*100)],
                        [1, Math.round(counts[1]/total*100)]];
              }
            }
            return [[5,85],[4,10],[3,3],[2,1],[1,1]];
          },

              };

            }
          }

                '<div class="qty-row"><button class="qty-btn" data-qty="-1">\u2212</button><span class="qty-val" id="qtyVal">'+state.qty+'</span><button class="qty-btn" data-qty="1">+</button></div>'+

              '<div class="rev-grid">'+
                '<div class="rev-score"><div class="big">'+(P.rating || 0).toFixed(1)+'</div>'+stars(P.rating,16,'#f59e0b')+'<div class="sub">Based on '+P.reviews+' reviews</div></div>'+
                '<div class="bars">'+DATA.bars.map(function(b){return '<div class="bar-row"><span class="n">'+b[0]+'</span><span class="star-i">'+starSVG(10)+'</span><div class="bar-track"><div class="bar-fill" style="width:'+b[1]+'%"></div></div><span class="bar-pct">'+b[1]+'%</span></div>';}).join('')+'</div>'+
                '<div class="rev-card" id="revCard">'+reviewCard()+'</div>'+
                (DATA.reviewsList.length > 1 ? '<div class="rev-nav"><button class="rev-arrow" data-rev="-1" aria-label="previous">'+I.chevL+'</button><button class="rev-arrow" data-rev="1" aria-label="next">'+I.chevR+'</button></div>' : '')+
              '</div>'+
            '</div>' : '')+
            (DATA.related.length > 0 ?
            '<div class="related"><h2>You Might Also Like</h2>'+
            '<div class="rel-grid">'+DATA.related.map(function(p){return productCard(p,false);}).join('')+'</div></div>' : '')+
          '</div>'+
          newsletter()+footer(DATA.footer.product);
        }

        /* ---------- 10. TRUST PERKS (uses store settings) ---------- */
        function buildPerksHTML() {
          var sd = window._storeData || {};
          var hide = sd.hideTrustIcons || {};
          var txt = sd.trustIconsText || {};
          var perks = [
            { key: 'free_shipping', hidden: !!hide.free_shipping,
              title: txt.free_shipping_title || t('trust_free_title') || 'Free Shipping',
              desc: txt.free_shipping_desc || t('trust_free_desc') || 'on orders over 5,000 DA',
              icon: I.truck },
            { key: 'easy_returns', hidden: !!hide.easy_returns,
              title: txt.easy_returns_title || t('trust_returns_title') || '30-Day Return',
              desc: txt.easy_returns_desc || t('trust_returns_desc') || 'Money back guarantee',
              icon: I.ret },
            { key: 'secure_payment', hidden: !!hide.secure_payment,
              title: txt.secure_payment_title || t('trust_secure_title') || 'Secure Payment',
              desc: txt.secure_payment_desc || t('trust_secure_desc') || '100% protected',
              icon: I.shield }
          ];
          var visible = perks.filter(function(p) { return !p.hidden; });
          if (!visible.length) return '';
          return visible.map(function(p) {
            return '<div class="perk">'+p.icon+'<div><b>'+escapeHTML(p.title)+'</b><span>'+escapeHTML(p.desc)+'</span></div></div>';
          }).join('');
        }

        /* ---------- 11. ROUTER ---------- */
        var app = document.getElementById('app');
        function page() { return (location.hash || '').indexOf('product') > -1 ? 'product' : 'home'; }
        function render(scrollTop) {
          app.innerHTML = page() === 'product' ? productView() : homeView();
          if (scrollTop !== false) window.scrollTo(0, 0);
          if (window.lucide) lucide.createIcons();
        }
        function route() { render(true); }
        function syncCart() {
          var total = getCart().reduce(function(s, i) { return s + i.qty; }, 0);
          state.cart = total;
          var els = document.querySelectorAll('.cart-count');
          for (var i = 0; i < els.length; i++) els[i].textContent = total;
        }

        /* ---------- 12. NAVIGATION HELPER ---------- */
        function navigateToProduct(product) {
          if (!product) return;
          state.product = product;
          state.selectedColor = 0;
          state.selectedSize = (product.sizes && product.sizes.length) ? product.sizes[0] : null;
          state.quantity = 1;
          state.qty = 1;
          state.color = (product.colors && product.colors[0]) ? product.colors[0].name : 'Default';
          state.tab = 'description';
          state.thumb = 0;
          state.currentImage = 0;
          state.review = 0;
          state.wishlist = false;
          if (typeof window.ShvPixels === 'object') window.ShvPixels.track('ViewContent', { content_ids: [String(product.id)], content_name: product.name, value: window._effectivePrice ? window._effectivePrice(product) : product.price, currency: 'DZD' });
          location.hash = '#/product';
        }

        /* ---------- 13. SEARCH OVERLAY ---------- */
        var searchOverlay = null;
        function openSearchOverlay() {
          if (!searchOverlay) {
            searchOverlay = document.createElement('div');
            searchOverlay.id = 'searchOverlay';
            searchOverlay.style.cssText = 'position:fixed;inset:0;z-index:9998;background:rgba(0,0,0,.5);display:none;align-items:flex-start;justify-content:center;padding:60px 20px;';
            searchOverlay.innerHTML =
              '<div style="background:#fff;width:100%;max-width:600px;border-radius:12px;padding:24px;max-height:80vh;overflow-y:auto;">' +
                '<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">' +
                  '<input id="searchOverlayInput" type="text" placeholder="Search products..." style="flex:1;padding:10px 14px;border:1px solid #e2e2e2;border-radius:8px;font-size:14px;font-family:inherit;outline:none;">' +
                  '<button id="searchOverlayClose" style="padding:10px 16px;background:#111;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;">Close</button>' +
                '</div>' +
                '<div id="searchOverlayResults" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;"></div>' +
              '</div>';
            document.body.appendChild(searchOverlay);
            var inp = searchOverlay.querySelector('#searchOverlayInput');
            var closeBtn = searchOverlay.querySelector('#searchOverlayClose');
            var resultsEl = searchOverlay.querySelector('#searchOverlayResults');
            closeBtn.addEventListener('click', closeSearchOverlay);
            searchOverlay.addEventListener('click', function(e) { if (e.target === searchOverlay) closeSearchOverlay(); });
            inp.addEventListener('input', function() {
              var q = inp.value.trim().toLowerCase();
              if (!q) { resultsEl.innerHTML = '<p style="grid-column:1/-1;color:#999;text-align:center;padding:20px;">Type to search...</p>'; return; }
              var results = NEON_DATA.products.filter(function(p) { return matchesQuery(p, q); });
              results = sortProducts(results, 'featured');
              if (!results.length) { resultsEl.innerHTML = '<p style="grid-column:1/-1;color:#999;text-align:center;padding:20px;">No results found</p>'; return; }
              resultsEl.innerHTML = results.map(function(p) {
                var eff = window._effectivePrice ? window._effectivePrice(p) : p.price;
                return '<div class="p-card" data-product-id="'+p.id+'" style="cursor:pointer;">' +
                  '<div class="p-img" data-go="product"><img src="'+((p.images&&p.images[0])?p.images[0]:p.image)+'" alt="'+escapeHTML(p.name)+'" loading="lazy"></div>' +
                  '<div class="p-name">'+escapeHTML(p.name)+'</div>' +
                  '<div class="p-row"><span class="p-price">'+formatProductPrice(eff)+'</span></div>' +
                '</div>';
              }).join('');
              var cards = resultsEl.querySelectorAll('[data-go="product"]');
              cards.forEach(function(card) {
                card.addEventListener('click', function() {
                  var id = card.closest('[data-product-id]').getAttribute('data-product-id');
                  var product = NEON_DATA.getProductById(id);
                  closeSearchOverlay();
                  navigateToProduct(product);
                });
              });
            });
          }
          searchOverlay.style.display = 'flex';
          document.body.style.overflow = 'hidden';
          var inp = searchOverlay.querySelector('#searchOverlayInput');
          if (inp) { inp.value = ''; inp.focus(); var re = searchOverlay.querySelector('#searchOverlayResults'); if (re) re.innerHTML = '<p style="grid-column:1/-1;color:#999;text-align:center;padding:20px;">Type to search...</p>'; }
        }
        function closeSearchOverlay() {
          if (searchOverlay) searchOverlay.style.display = 'none';
          document.body.style.overflow = '';
        }

        /* ---------- 14. CHECKOUT MODAL ---------- */
        var checkoutModal = null;
        function openCheckoutModal() {
          var cart = getCart();
          if (!cart.length) { showToast(t('toast_cart_empty') || 'Cart is empty'); return; }
          if (!checkoutModal) {
            checkoutModal = document.createElement('div');
            checkoutModal.id = 'checkoutModal';
            checkoutModal.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.5);display:none;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;';
            document.body.appendChild(checkoutModal);
          }
          var d = state.checkoutData || {};
          var wilayaOptions = ALGERIAN_WILAYAS.map(function(w) { return '<option value="'+escapeHTML(w)+'"'+(d.wilaya===w?' selected':'')+'>'+escapeHTML(w)+'</option>'; }).join('');

          // ── Compute totals including TTS (Try Two Sizes) ──
          var subtotal = 0;
          var allFree = true;
          var cartTtsItems = []; // items that qualify for TTS
          cart.forEach(function(item) {
            subtotal += item.price * item.qty;
            // Check free shipping
            var itemFree = item.freeShipping === true;
            if (!itemFree && item.id && NEON_DATA && Array.isArray(NEON_DATA.products)) {
              var pFree = NEON_DATA.products.find(function(x){return String(x.id)===String(item.id);});
              if (pFree && pFree.freeShipping === true) itemFree = true;
            }
            if (!itemFree) allFree = false;
            // Check TTS availability for this item
            var prod = (item.id && NEON_DATA && Array.isArray(NEON_DATA.products)) ?
              NEON_DATA.products.find(function(x){return String(x.id)===String(item.id);}) : null;
            if (prod) {
              var effUnit = window._effectivePrice ? window._effectivePrice(prod) : prod.price;
              var ttsAvailable = !!(window._storeData && window._storeData.ttsEnabled === true
                                    && prod.ttsEnabled === true
                                    && prod.sizes && prod.sizes.length >= 2
                                    && effUnit >= (Number(window._storeData.ttsMinPrice) || 0));
              if (ttsAvailable) {
                cartTtsItems.push({ item: item, product: prod, effUnit: effUnit });
              }
            }
          });
          var shipping = allFree ? 0 : calcShipping(d.wilaya || '', subtotal, window._storeData, d.deliveryType || 'home');

          // TTS fee: sum of fees for items where TTS is enabled
          var ttsTotalFee = 0;
          var ttsEnabledItems = [];
          if (cartTtsItems.length > 0 && state.ttsCart) {
            cartTtsItems.forEach(function(ct) {
              var itemKey = String(ct.item.id) + '|' + ct.item.size + '|' + ct.item.color;
              if (state.ttsCart[itemKey] && state.ttsCart[itemKey].enabled) {
                var fee = Number(ct.product.ttsFee || (window._storeData && window._storeData.ttsDefaultFee)) || 0;
                ttsTotalFee += fee;
                ttsEnabledItems.push({ item: ct.item, backupSize: state.ttsCart[itemKey].backupSize, fee: fee });
              }
            });
          }
          var total = subtotal + shipping + ttsTotalFee;

          // ── Build TTS section HTML (if any TTS-eligible items exist) ──
          var ttsSectionHTML = '';
          if (cartTtsItems.length > 0) {
            ttsSectionHTML = '<div style="background:#f5f3ff;border:1px solid #c4b5fd;border-radius:8px;padding:14px;margin-bottom:16px;">' +
              '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">' +
                '<span style="font-size:16px;">✨</span>' +
                '<h4 style="font-size:13px;font-weight:700;color:#5b21b6;margin:0;">' + escapeHTML(t('tts_title') || 'Try Two Sizes') + '</h4>' +
              '</div>' +
              '<p style="font-size:11px;color:#6b21a8;margin-bottom:12px;line-height:1.5;">' + escapeHTML(t('tts_desc') || 'Not sure about your size? Add a backup size for a small fee and we will ship both — keep the one that fits.') + '</p>';
            cartTtsItems.forEach(function(ct) {
              var itemKey = String(ct.item.id) + '|' + ct.item.size + '|' + ct.item.color;
              var ttsState = (state.ttsCart && state.ttsCart[itemKey]) || { enabled: false, backupSize: '' };
              var fee = Number(ct.product.ttsFee || (window._storeData && window._storeData.ttsDefaultFee)) || 0;
              ttsSectionHTML += '<div style="background:#fff;border:1px solid #ddd6fe;border-radius:6px;padding:10px;margin-bottom:8px;' + (ttsState.enabled ? '' : 'opacity:0.7;') + '">' +
                '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:' + (ttsState.enabled ? '8px' : '0') + ';">' +
                  '<div style="flex:1;"><div style="font-size:12px;font-weight:600;color:#333;">' + escapeHTML(ct.item.name) + '</div>' +
                  '<div style="font-size:10px;color:#888;">' + escapeHTML(t('os_size') || 'Size') + ': ' + escapeHTML(ct.item.size) + ' • ' + escapeHTML(t('tts_fee') || 'Fee') + ': ' + formatProductPrice(fee) + '</div></div>' +
                  '<button type="button" data-tts-toggle="' + escapeHTML(itemKey) + '" style="padding:4px 10px;border-radius:4px;font-size:11px;font-weight:600;cursor:pointer;border:none;background:' + (ttsState.enabled ? '#7c3aed' : '#e5e7eb') + ';color:' + (ttsState.enabled ? '#fff' : '#333') + ';">' + (ttsState.enabled ? '✓ Enabled' : (t('tts_add') || 'Add Backup')) + '</button>' +
                '</div>';
              if (ttsState.enabled) {
                ttsSectionHTML += '<div style="display:flex;gap:6px;flex-wrap:wrap;">' +
                  ct.product.sizes.map(function(s) {
                    var isCurrent = (s === ct.item.size);
                    var isBackup = (s === ttsState.backupSize);
                    return '<button type="button" data-tts-size="' + escapeHTML(itemKey) + '" data-size="' + escapeHTML(s) + '"' +
                      (isCurrent ? ' disabled' : '') +
                      ' style="padding:5px 10px;border:1px solid ' + (isBackup ? '#7c3aed' : '#ddd') + ';border-radius:4px;font-size:11px;cursor:' + (isCurrent ? 'not-allowed' : 'pointer') + ';background:' + (isBackup ? '#7c3aed' : '#fff') + ';color:' + (isBackup ? '#fff' : '#333') + ';' + (isCurrent ? 'opacity:0.5;' : '') + '">' + escapeHTML(s) + (isCurrent ? ' ✓' : '') + '</button>';
                  }).join('') +
                '</div>';
              }
              ttsSectionHTML += '</div>';
            });
            ttsSectionHTML += '</div>';
          }

          checkoutModal.innerHTML =
            '<div style="background:#fff;width:100%;max-width:560px;border-radius:12px;padding:28px;margin:auto;">' +
              '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">' +
                '<h2 style="font-size:22px;font-weight:700;">Checkout</h2>' +
                '<button id="checkoutClose" style="font-size:24px;color:#999;background:none;border:none;cursor:pointer;">&times;</button>' +
              '</div>' +
              '<div id="checkoutItems" style="margin-bottom:20px;">' +
                cart.map(function(item) {
                  return '<div style="display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #eee;">' +
                    '<img src="'+item.image+'" alt="'+escapeHTML(item.name)+'" style="width:50px;height:50px;object-fit:cover;border-radius:6px;">' +
                    '<div style="flex:1;"><div style="font-size:13px;font-weight:600;">'+escapeHTML(item.name)+'</div>' +
                    '<div style="font-size:11px;color:#888;">'+escapeHTML(item.color)+' / '+escapeHTML(item.size)+' x '+item.qty+'</div></div>' +
                    '<div style="font-size:13px;font-weight:700;">'+formatProductPrice(item.price*item.qty)+'</div>' +
                  '</div>';
                }).join('') +
              '</div>' +
              ttsSectionHTML +
              '<div style="background:#f8f8f8;border-radius:8px;padding:14px;margin-bottom:20px;">' +
                '<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;"><span>Subtotal</span><span>'+formatProductPrice(subtotal)+'</span></div>' +
                '<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;"><span>Shipping</span><span>'+(shipping===0?'FREE':formatProductPrice(shipping))+'</span></div>' +
                (ttsTotalFee > 0 ? '<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;color:#7c3aed;"><span>' + escapeHTML(t('tts_fee') || 'TTS Fee') + '</span><span>'+formatProductPrice(ttsTotalFee)+'</span></div>' : '') +
                '<div style="display:flex;justify-content:space-between;font-size:15px;font-weight:700;border-top:1px solid #ddd;padding-top:8px;"><span>Total</span><span>'+formatProductPrice(total)+'</span></div>' +
              '</div>' +
              '<form id="checkoutForm" style="display:flex;flex-direction:column;gap:12px;">' +
                '<input type="text" id="ckName" placeholder="Full Name *" maxlength="100" style="padding:10px 14px;border:1px solid #e2e2e2;border-radius:8px;font-size:14px;font-family:inherit;" value="'+escapeHTML(d.fullName||'')+'">' +
                '<input type="tel" id="ckPhone" placeholder="Phone (05/06/07xxxxxxxx) *" maxlength="15" pattern="0[5-7][0-9]{8}" style="padding:10px 14px;border:1px solid #e2e2e2;border-radius:8px;font-size:14px;font-family:inherit;" value="'+escapeHTML(d.phone||'')+'">' +
                '<select id="ckWilaya" style="padding:10px 14px;border:1px solid #e2e2e2;border-radius:8px;font-size:14px;font-family:inherit;"><option value="">Select Wilaya *</option>'+wilayaOptions+'</select>' +
                '<input type="text" id="ckBaladiya" placeholder="Baladiya (Municipality) *" maxlength="100" style="padding:10px 14px;border:1px solid #e2e2e2;border-radius:8px;font-size:14px;font-family:inherit;" value="'+escapeHTML(d.baladiya||'')+'">' +
                '<textarea id="ckAddress" placeholder="Detailed Address *" maxlength="300" style="padding:10px 14px;border:1px solid #e2e2e2;border-radius:8px;font-size:14px;font-family:inherit;resize:vertical;min-height:70px;">'+escapeHTML(d.address||'')+'</textarea>' +
                '<textarea id="ckNotes" placeholder="Additional Notes (Optional)" maxlength="500" style="padding:10px 14px;border:1px solid #e2e2e2;border-radius:8px;font-size:14px;font-family:inherit;resize:vertical;min-height:50px;">'+escapeHTML(d.notes||'')+'</textarea>' +
                '<div style="display:flex;gap:8px;">' +
                  '<button type="button" data-delivery="home" class="delivery-type-btn" style="flex:1;padding:10px;border:1px solid #e2e2e2;border-radius:8px;cursor:pointer;font-size:13px;background:'+(d.deliveryType!=='office'?'#111':'#fff')+';color:'+(d.deliveryType!=='office'?'#fff':'#111')+';">Home Delivery</button>' +
                  '<button type="button" data-delivery="office" class="delivery-type-btn" style="flex:1;padding:10px;border:1px solid #e2e2e2;border-radius:8px;cursor:pointer;font-size:13px;background:'+(d.deliveryType==='office'?'#111':'#fff')+';color:'+(d.deliveryType==='office'?'#fff':'#111')+';">Office Pickup</button>' +
                '</div>' +
                '<button type="submit" id="checkoutSubmit" style="padding:14px;background:#111;color:#fff;border:none;border-radius:999px;cursor:pointer;font-size:14px;font-weight:600;margin-top:8px;">Place Order</button>' +
              '</form>' +
            '</div>';
          checkoutModal.style.display = 'flex';
          document.body.style.overflow = 'hidden';
          checkoutModal.querySelector('#checkoutClose').addEventListener('click', closeCheckoutModal);
          checkoutModal.addEventListener('click', function(e) { if (e.target === checkoutModal) closeCheckoutModal(); });
          var dtBtns = checkoutModal.querySelectorAll('.delivery-type-btn');
          dtBtns.forEach(function(btn) {
            btn.addEventListener('click', function() {
              dtBtns.forEach(function(b) { b.style.background = '#fff'; b.style.color = '#111'; });
              btn.style.background = '#111'; btn.style.color = '#fff';
              if (!state.checkoutData) state.checkoutData = {};
              state.checkoutData.deliveryType = btn.getAttribute('data-delivery');
              openCheckoutModal();
            });
          });
          var wilayaSel = checkoutModal.querySelector('#ckWilaya');
          wilayaSel.addEventListener('change', function() {
            if (!state.checkoutData) state.checkoutData = {};
            state.checkoutData.wilaya = wilayaSel.value;
            openCheckoutModal();
          });

          // ── TTS toggle buttons: handled via global delegation (see document click handler) ──
          // No direct listeners here — they break on re-render. Global delegation is more reliable.

          var form = checkoutModal.querySelector('#checkoutForm');
          form.addEventListener('submit', async function(e) {
            e.preventDefault();
            var nm = checkoutModal.querySelector('#ckName').value.trim();
            var ph = checkoutModal.querySelector('#ckPhone').value.trim();
            var wl = checkoutModal.querySelector('#ckWilaya').value;
            var bl = checkoutModal.querySelector('#ckBaladiya').value.trim();
            var ad = checkoutModal.querySelector('#ckAddress').value.trim();
            var nt = checkoutModal.querySelector('#ckNotes').value.trim();
            if (!nm || !ph || !wl || !bl || !ad) { showToast(t('of_required') || 'Please fill all fields'); return; }
            if (!/^0[5-7]\d{8}$/.test(ph)) { showToast(t('of_required') || 'Invalid phone'); return; }
            if (typeof window._shvIsRepeatedDigitsPhone === 'function' && window._shvIsRepeatedDigitsPhone(ph)) { showToast(t('of_required') || 'Invalid phone'); return; }
            if (typeof window._shvCheckRateLimit === 'function') { var _rl = window._shvCheckRateLimit(); if (_rl > 0) { showToast(t('of_required') || 'Wait'); return; } }

            // ── Validate TTS: if enabled, backup size must be selected ──
            var ttsPayloadItems = [];
            var ttsTotalFeeCheck = 0;
            if (cartTtsItems.length > 0 && state.ttsCart) {
              var ttsError = '';
              cartTtsItems.forEach(function(ct) {
                var itemKey = String(ct.item.id) + '|' + ct.item.size + '|' + ct.item.color;
                if (state.ttsCart[itemKey] && state.ttsCart[itemKey].enabled) {
                  if (!state.ttsCart[itemKey].backupSize) {
                    ttsError = t('tts_backup_label') || 'Please select backup size';
                  } else {
                    var fee = Number(ct.product.ttsFee || (window._storeData && window._storeData.ttsDefaultFee)) || 0;
                    ttsTotalFeeCheck += fee;
                    ttsPayloadItems.push({ itemKey: itemKey, backupSize: state.ttsCart[itemKey].backupSize, fee: fee });
                  }
                }
              });
              if (ttsError) { showToast(ttsError); return; }
            }

            state.checkoutData = { fullName: nm, phone: ph, wilaya: wl, baladiya: bl, address: ad, notes: nt, deliveryType: (state.checkoutData && state.checkoutData.deliveryType) || 'home' };
            var submitBtn = checkoutModal.querySelector('#checkoutSubmit');
            submitBtn.disabled = true; submitBtn.textContent = '...';
            try {
              var freshCart = getCart();
              var freshSubtotal = freshCart.reduce(function(s,i){return s+(i.price*i.qty);},0);
              var freshAllFree = freshCart.every(function(it) { return it.freeShipping === true; });
              var freshShipping = freshAllFree ? 0 : calcShipping(wl, freshSubtotal, window._storeData, state.checkoutData.deliveryType);
              var freshTotal = freshSubtotal + freshShipping + ttsTotalFeeCheck;

              // ── Build items with TTS info ──
              var items = freshCart.map(function(i) {
                var itemKey = String(i.id) + '|' + i.size + '|' + i.color;
                var ttsInfo = null;
                if (state.ttsCart && state.ttsCart[itemKey] && state.ttsCart[itemKey].enabled) {
                  ttsInfo = { backup_size: state.ttsCart[itemKey].backupSize, fee: 0 };
                  // Find the product to get the fee
                  var prod = NEON_DATA.products.find(function(x){return String(x.id)===String(i.id);});
                  if (prod) ttsInfo.fee = Number(prod.ttsFee || (window._storeData && window._storeData.ttsDefaultFee)) || 0;
                }
                return {
                  id: i.id, name: i.name, qty: i.qty, unit_price: i.price, line_total: i.price*i.qty,
                  size: i.size, color: i.color, free_shipping: i.freeShipping === true,
                  tts_enabled: !!(ttsInfo), tts_backup_size: ttsInfo ? ttsInfo.backup_size : null, tts_fee: ttsInfo ? ttsInfo.fee : 0
                };
              });

              var payload = {
                customer: { name: nm, phone: ph, wilaya: wl, commune: bl, address: ad, delivery_type: state.checkoutData.deliveryType, notes: nt },
                items: items,
                pricing: { subtotal: freshSubtotal, shipping_fee: freshShipping, tts_fee: ttsTotalFeeCheck, total: freshTotal, currency: 'DZD' },
                note: nt || null,
                try_two_sizes: ttsPayloadItems.length > 0,
                tts_backup_size: ttsPayloadItems.length === 1 ? ttsPayloadItems[0].backupSize : (ttsPayloadItems.length > 1 ? JSON.stringify(ttsPayloadItems) : null),
                tts_items: ttsPayloadItems.length > 0 ? ttsPayloadItems : null
              };
              if (typeof window._shvVerifyOrderPrices === 'function') {
                try { payload = await window._shvVerifyOrderPrices(payload, (window._storeData && window._storeData.id) || window._getStoreId(), wl, state.checkoutData.deliveryType); }
                catch(verr) { showToast(t('of_required') + ': ' + (verr.message||'')); submitBtn.disabled = false; submitBtn.textContent = 'Place Order'; return; }
              }
              if (typeof window.saveOrderToFirestore === 'function') {
                await window.saveOrderToFirestore(payload);
                if (typeof window._shvStampSubmit === 'function') window._shvStampSubmit();
                if (typeof window.ShvPixels === 'object') window.ShvPixels.track('Purchase', { value: payload.pricing.total, currency: 'DZD', num_items: freshCart.reduce(function(s,i){return s+i.qty;},0) });
              }
              setCart([]);
              syncCart();
              state.ttsCart = {};
              if (typeof renderCart === 'function') renderCart();
              state.checkoutData = { fullName:'', phone:'', wilaya:'', baladiya:'', address:'', notes:'', deliveryType:'home' };
              showToast(t('of_order_success') || 'Order placed successfully!');
              closeCheckoutModal();
              setTimeout(function() { location.hash = '#/'; }, 1500);
            } catch(err) {
              showToast(t('of_required') + ': ' + (err.message||''));
              console.error('Checkout error:', err);
            } finally {
              submitBtn.disabled = false; submitBtn.textContent = 'Place Order';
            }
          });
        }
        function closeCheckoutModal() {
          if (checkoutModal) checkoutModal.style.display = 'none';
          document.body.style.overflow = '';
        }

        /* ---------- 15. EVENT DELEGATION ---------- */
        document.addEventListener('click', function(e) {
          var noop = e.target.closest('[data-noop]'); if (noop) { e.preventDefault(); return; }

          var wish = e.target.closest('[data-wish]');
          if (wish) {
            e.preventDefault(); e.stopPropagation();
            var id = wish.dataset.wish;
            state.wish = state.wish || {};
            state.wish[id] = !state.wish[id];
            wish.classList.toggle('active', !!state.wish[id]);
            try { localStorage.setItem('jolt_wish', JSON.stringify(state.wish)); } catch(err) {}
            showToast(state.wish[id] ? (t('toast_added_wishlist') || 'Added to wishlist') : (t('toast_removed_wishlist') || 'Removed from wishlist'));
            return;
          }

          var add = e.target.closest('[data-add]');
          if (add) {
            e.preventDefault(); e.stopPropagation();
            var card = add.closest('[data-product-id]');
            var productId = card ? card.getAttribute('data-product-id') : null;
            var product = null;
            if (productId) product = NEON_DATA.getProductById(productId);
            if (!product) {
              var nameEl = card && card.querySelector('.p-name');
              var name = nameEl && nameEl.textContent;
              if (name) product = NEON_DATA.products.find(function(p) { return p.name === name; });
            }
            if (product) {
              var size = (product.sizes && product.sizes[0]) || 'One Size';
              var color = (product.colors && product.colors[0]) ? product.colors[0].name : 'Default';
              addToCart(product, size, color, 1);
              syncCart();
            }
            return;
          }

          var sw = e.target.closest('[data-swatch]');
          if (sw) {
            e.preventDefault();
            state.color = sw.dataset.swatch;
            state.selectedColor = parseInt(sw.dataset.index || '0', 10);
            var swatches = document.querySelectorAll('.swatch');
            swatches.forEach(function(s) { s.classList.toggle('sel', s === sw); });
            var cn = document.getElementById('colorName');
            if (cn) cn.textContent = state.color;
            return;
          }

          // Size selector (NEW) — but SKIP if it's a TTS backup size button (has data-tts-size)
          var sb = e.target.closest('[data-size]');
          if (sb && !sb.hasAttribute('data-tts-size')) {
            e.preventDefault();
            e.stopPropagation();
            state.selectedSize = sb.dataset.size;
            var sizeBtns = document.querySelectorAll('.size-btn');
            sizeBtns.forEach(function(s) {
              s.classList.remove('sel');
              s.style.background = '#fff';
              s.style.color = '#111';
              s.style.borderColor = '#e2e2e2';
            });
            sb.classList.add('sel');
            sb.style.background = '#111';
            sb.style.color = '#fff';
            sb.style.borderColor = '#111';
            var sv = document.getElementById('sizeValue');
            if (sv) sv.textContent = state.selectedSize;
            return;
          }

          // ── TTS toggle (Try Two Sizes enable/disable per cart item) ──
          var ttsToggle = e.target.closest('[data-tts-toggle]');
          if (ttsToggle) {
            e.preventDefault();
            e.stopPropagation();
            var ttsKey = ttsToggle.getAttribute('data-tts-toggle');
            if (!state.ttsCart) state.ttsCart = {};
            if (!state.ttsCart[ttsKey]) state.ttsCart[ttsKey] = { enabled: false, backupSize: '' };
            state.ttsCart[ttsKey].enabled = !state.ttsCart[ttsKey].enabled;
            if (!state.ttsCart[ttsKey].enabled) state.ttsCart[ttsKey].backupSize = '';
            // Re-render checkout modal if open
            if (checkoutModal && checkoutModal.style.display === 'flex') {
              openCheckoutModal();
            }
            return;
          }

          // ── TTS backup size selection ──
          var ttsSizeBtn = e.target.closest('[data-tts-size]');
          if (ttsSizeBtn) {
            e.preventDefault();
            e.stopPropagation();
            var ttsSizeKey = ttsSizeBtn.getAttribute('data-tts-size');
            var ttsSizeVal = ttsSizeBtn.getAttribute('data-size');
            if (!state.ttsCart) state.ttsCart = {};
            if (!state.ttsCart[ttsSizeKey]) state.ttsCart[ttsSizeKey] = { enabled: true, backupSize: '' };
            state.ttsCart[ttsSizeKey].backupSize = ttsSizeVal;
            // Re-render checkout modal if open
            if (checkoutModal && checkoutModal.style.display === 'flex') {
              openCheckoutModal();
            }
            return;
          }

          var qb = e.target.closest('[data-qty]');
          if (qb) {
            e.preventDefault();
            state.qty = Math.max(1, state.qty + parseInt(qb.dataset.qty, 10));
            state.quantity = state.qty;
            var qv = document.getElementById('qtyVal');
            if (qv) qv.textContent = state.qty;
            return;
          }

          var ac = e.target.closest('[data-addcart]');
          if (ac) {
            e.preventDefault();
            var p = state.product;
            if (p) {
              if (!state.selectedSize && p.sizes && p.sizes.length > 0) {
                showToast(t('toast_select_size') || 'Please select a size');
                return;
              }
              var size2 = state.selectedSize || (p.sizes && p.sizes[0]) || 'One Size';
              var color2 = state.color || (p.colors && p.colors[0] && p.colors[0].name) || 'Default';
              addToCart(p, size2, color2, state.qty);
              syncCart();
            }
            return;
          }

          var bn = e.target.closest('[data-buynow]');
          if (bn) {
            e.preventDefault();
            var bp = state.product;
            if (bp) {
              if (!state.selectedSize && bp.sizes && bp.sizes.length > 0) {
                showToast(t('toast_select_size') || 'Please select a size');
                return;
              }
              var bsize = state.selectedSize || (bp.sizes && bp.sizes[0]) || 'One Size';
              var bcolor = state.color || (bp.colors && bp.colors[0] && bp.colors[0].name) || 'Default';
              addToCart(bp, bsize, bcolor, state.qty);
              syncCart();
              openCheckoutModal();
            }
            return;
          }

          var tb = e.target.closest('[data-tab]');
          if (tb) {
            e.preventDefault();
            state.tab = tb.dataset.tab;
            var tabs = document.querySelectorAll('.tab');
            tabs.forEach(function(t) { t.classList.toggle('active', t === tb); });
            var db = document.getElementById('descBody');
            if (db) db.innerHTML = descBody();
            return;
          }

          var th = e.target.closest('[data-thumb]');
          if (th) {
            e.preventDefault();
            state.thumb = parseInt(th.dataset.thumb, 10);
            state.currentImage = state.thumb;
            var mi = document.getElementById('mainImg');
            if (mi) mi.src = DATA.product.thumbs[state.thumb];
            var thumbs = document.querySelectorAll('.thumb');
            thumbs.forEach(function(t) { t.classList.toggle('sel', t === th); });
            return;
          }

          var tn = e.target.closest('[data-thumbnext]');
          if (tn) {
            e.preventDefault();
            var thumbsArr = DATA.product.thumbs;
            state.thumb = (state.thumb + 1) % thumbsArr.length;
            state.currentImage = state.thumb;
            var mi2 = document.getElementById('mainImg');
            if (mi2) mi2.src = thumbsArr[state.thumb];
            var thumbs2 = document.querySelectorAll('.thumb');
            thumbs2.forEach(function(t, i) { t.classList.toggle('sel', i === state.thumb); });
            return;
          }

          var rv = e.target.closest('[data-rev]');
          if (rv) {
            e.preventDefault();
            var n = DATA.reviewsList.length;
            if (n > 0) {
              state.review = (state.review + parseInt(rv.dataset.rev, 10) + n) % n;
              var rc = document.getElementById('revCard');
              if (rc) rc.innerHTML = reviewCard();
            }
            return;
          }

          var go = e.target.closest('[data-go]');
          if (go) {
            e.preventDefault();
            if (go.dataset.go === 'product') {
              var goCard = go.closest('[data-product-id]');
              var goProductId = goCard ? goCard.getAttribute('data-product-id') : null;
              var goProduct = null;
              if (goProductId) goProduct = NEON_DATA.getProductById(goProductId);
              if (!goProduct && NEON_DATA.products.length) goProduct = NEON_DATA.products[0];
              if (goProduct) {
                navigateToProduct(goProduct);
              } else {
                location.hash = '#/product';
              }
            } else {
              location.hash = '#/';
            }
            return;
          }

          var cartOpen = e.target.closest('[data-cart-open]');
          if (cartOpen) {
            e.preventDefault();
            if (typeof openCart === 'function') openCart();
            return;
          }

          var searchOpen = e.target.closest('[data-search-open]');
          if (searchOpen) {
            e.preventDefault();
            openSearchOverlay();
            return;
          }

          var mainImg = e.target.closest('#mainImg');
          if (mainImg && typeof openZoomViewer === 'function') {
            openZoomViewer(state.currentImage || 0);
            return;
          }
        });

        document.addEventListener('submit', function(e) {
          var f = e.target.closest('.news-form');
          if (f) { e.preventDefault(); f.querySelector('input').value = ''; showToast('Subscribed!'); }
        });

        window.addEventListener('hashchange', function() { render(); });

        // ESC key closes overlays
        document.addEventListener('keydown', function(e) {
          if (e.key === 'Escape') {
            if (searchOverlay && searchOverlay.style.display === 'flex') closeSearchOverlay();
            if (checkoutModal && checkoutModal.style.display === 'flex') closeCheckoutModal();
          }
        });

        /* ---------- 16. NEW INIT FUNCTION (loads store + products from Supabase) ---------- */
        // Wait for Supabase module to be ready (it's loaded async as type="module")
        function waitForSupabase(timeout) {
          timeout = timeout || 8000;
          return new Promise(function(resolve) {
            if (typeof window.fetchStoreFromFirestore === 'function') return resolve(true);
            var start = Date.now();
            var interval = setInterval(function() {
              if (typeof window.fetchStoreFromFirestore === 'function') {
                clearInterval(interval);
                resolve(true);
              } else if (Date.now() - start > timeout) {
                clearInterval(interval);
                console.warn('Supabase module not loaded after', timeout, 'ms — using fallback data');
                resolve(false);
              }
            }, 100);
          });
        }

        async function init() {
          // ── Safety timeout: hide loading screen after 5s no matter what ──
          setTimeout(function() {
            var _ls = document.getElementById('loadingScreen');
            if (_ls) { _ls.style.opacity = '0'; setTimeout(function() { if (_ls.parentNode) _ls.parentNode.removeChild(_ls); }, 300); }
          }, 5000);

          // Init cart count from localStorage
          setCart(getCart());
          syncCart();

          // Bind cart drawer + zoom viewer + language toggle
          bindCart();
          bindZoomViewer();
          bindLanguageToggle();

          // Load wishlist from localStorage
          try {
            var savedWish = JSON.parse(localStorage.getItem('jolt_wish') || '{}');
            state.wish = savedWish || {};
          } catch(e) { state.wish = {}; }

          // Set default language
          if (typeof currentLang !== 'undefined') {
            try { currentLang = localStorage.getItem(LANG_KEY) === 'ar' ? 'ar' : 'en'; } catch(e) {}
          }

          // ── CRITICAL: Apply cached store settings BEFORE first render ──
          // This prevents the "flash" where default hero/name shows for 1 second
          // before Supabase returns the real store customization.
          // Cache key: shv_store_<storeId> (same as fetchStoreFromFirestore uses)
          var _preStoreId = window._getStoreId && window._getStoreId();
          if (_preStoreId) {
            try {
              var _cacheKey = 'shv_store_' + _preStoreId.trim();
              var _cachedRaw = localStorage.getItem(_cacheKey);
              if (_cachedRaw) {
                var _cachedParsed = JSON.parse(_cachedRaw);
                if (_cachedParsed && _cachedParsed.store) {
                  window._storeData = _cachedParsed.store;
                }
                // Also restore cached products if available
                if (_cachedParsed && _cachedParsed.products && Array.isArray(_cachedParsed.products) && _cachedParsed.products.length > 0) {
                  NEON_DATA.products = _cachedParsed.products;
                  state.product = NEON_DATA.products[0];
                  state.color = (state.product.colors && state.product.colors[0]) ? state.product.colors[0].name : 'Default';
                  state.selectedSize = (state.product.sizes && state.product.sizes[0]) || null;
                }
              }
            } catch(e) { /* ignore cache errors */ }
          }

          // Set default product from NEON_DATA if not already set from cache
          if (!state.product && NEON_DATA && NEON_DATA.products && NEON_DATA.products.length) {
            state.product = NEON_DATA.products[0];
            state.color = (state.product.colors && state.product.colors[0]) ? state.product.colors[0].name : 'Default';
          }

          // ── If we have cached store data, render immediately (no flash) ──
          // Then refresh from Supabase in the background.
          var _hasCache = !!(window._storeData);
          if (_hasCache) {
            render();
            var _ls0 = document.getElementById('loadingScreen');
            if (_ls0) { _ls0.style.opacity = '0'; setTimeout(function() { if (_ls0.parentNode) _ls0.parentNode.removeChild(_ls0); }, 300); }
          }

          // ── Wait for Supabase module to be ready ──
          await waitForSupabase();

          // ── Load store data from Supabase ──
          var storeId = window._getStoreId && window._getStoreId();
          if (storeId && typeof window.fetchStoreFromFirestore === 'function') {
            try {
              var result = await window.fetchStoreFromFirestore(storeId);
              if (result.store) {
                window._storeData = result.store;
                if (typeof window.ShvPixels === 'object') window.ShvPixels.init(result.store);
                // Update document title with store name
                if (result.store.name) document.title = result.store.name;
              }
              if (result.products && result.products.length > 0) {
                NEON_DATA.products = result.products.map(function(p, i) {
                  return {
                    id: p.id || (i + 1),
                    name: p.name || '',
                    category: p.category || 'general',
                    categoryLabel: p.category || 'General',
                    price: p.price || 0,
                    discountPrice: p.discountPrice || null,
                    originalPrice: p.originalPrice || null,
                    rating: (typeof window._shvProductRating === 'function') ? window._shvProductRating(p) : (p.rating || 0),
                    reviews: (typeof window._shvProductReviewCount === 'function') ? window._shvProductReviewCount(p) : (p.reviews || 0),
                    badge: p.badge || '',
                    isNew: p.isNew || false,
                    images: p.images && p.images.length > 0 ? p.images : [p.image || ''],
                    image: p.image || '',
                    emoji: p.emoji || '',
                    shortDesc: p.shortDesc || p.desc || '',
                    desc: p.desc || '',
                    colors: p.colors || [],
                    sizes: p.sizes || [],
                    details: Array.isArray(p.details) ? p.details : (p.details ? [String(p.details)] : []),
                    materials: p.materials || '',
                    sizeFit: p.sizeFit || '',
                    shipping: p.shipping || '',
                    shippingReturns: p.shippingReturns || '',
                    reviewsText: p.reviewsText || '',
                    reviewsData: Array.isArray(p.reviewsData) ? p.reviewsData : [],
                    slug: p.slug || '',
                    freeShipping: p.freeShipping === true,
                    ttsEnabled: p.ttsEnabled === true,
                    ttsFee: p.ttsFee || 0
                  };
                });
                // Build categories from products
                var catMap = {};
                NEON_DATA.products.forEach(function(p) {
                  if (p.category && !catMap[p.category]) {
                    catMap[p.category] = { id: p.category, name: p.categoryLabel || p.category, blurb: '', image: (p.images && p.images[0]) ? p.images[0] : (p.image || '') };
                  }
                });
                NEON_DATA.categories = Object.values(catMap);
                if (NEON_DATA.products.length) {
                  state.product = NEON_DATA.products[0];
                  state.color = (state.product.colors && state.product.colors[0]) ? state.product.colors[0].name : 'Default';
                  state.selectedSize = (state.product.sizes && state.product.sizes[0]) || null;
                }
              }
              // Realtime subscription for live updates
              if (typeof window.subscribeToStoreProducts === 'function') {
                window.subscribeToStoreProducts(storeId, function(products) {
                  if (!products || !products.length) return;
                  NEON_DATA.products = products.map(function(p, i) {
                    return {
                      id: p.id || (i + 1), name: p.name || '', category: p.category || 'general',
                      categoryLabel: p.category || 'General', price: p.price || 0,
                      discountPrice: p.discountPrice || null, originalPrice: p.originalPrice || null,
                      rating: (typeof window._shvProductRating === 'function') ? window._shvProductRating(p) : (p.rating || 0),
                      reviews: (typeof window._shvProductReviewCount === 'function') ? window._shvProductReviewCount(p) : (p.reviews || 0),
                      badge: p.badge || '', isNew: false,
                      images: p.images && p.images.length > 0 ? p.images : [p.image || ''],
                      image: p.image || '', shortDesc: p.desc || '', desc: p.desc || '',
                      colors: p.colors || [], sizes: p.sizes || [],
                      details: Array.isArray(p.details) ? p.details : ['Quality product'],
                      materials: '', sizeFit: '', shipping: '',
                      shippingReturns: p.shippingReturns || '',
                      reviewsText: p.reviewsText || '',
                      reviewsData: Array.isArray(p.reviewsData) ? p.reviewsData : [],
                      slug: p.slug || '', freeShipping: p.freeShipping === true,
                      ttsEnabled: p.ttsEnabled === true, ttsFee: p.ttsFee || 0
                    };
                  });
                  render(false);
                });
              }
            } catch(e) {
              console.warn('Supabase load failed, using fallback data:', e);
            }
          }

          // Pixel: PageView
          if (typeof window.ShvPixels === 'object') window.ShvPixels.track('PageView');

          // Re-render with real data
          render();

          // ── Hide loading screen (with fade) once first real render is done ──
          var _ls = document.getElementById('loadingScreen');
          if (_ls) {
            _ls.style.opacity = '0';
            setTimeout(function() { if (_ls.parentNode) _ls.parentNode.removeChild(_ls); }, 300);
          }

          // Handle browser back/forward
          window.addEventListener('popstate', function() { render(); });

          // Init icons
          if (window.lucide) lucide.createIcons();
        }

        // Start
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();

</script>

</body>
