<!-- Prevent caching of old version -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="version" content="noir-v3">

<!-- Force fresh load: redirect to URL with version param if missing -->
<script>
(function() {
    try {
        var VERSION = 'noir-v3';
        var url = new URL(window.location.href);
        if (url.searchParams.get('cv') !== VERSION) {
            url.searchParams.set('cv', VERSION);
            window.location.replace(url.toString());
        }
    } catch (e) {
        console.error('Cache bust failed:', e);
    }
})();
</script>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/inter@latest/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/inter@latest/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/inter@latest/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/inter@latest/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/inter@latest/800.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>

*{margin:0;padding:0;box-sizing:border-box}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
a{text-decoration:none;color:inherit}
img{display:block}
html,body{background:#fff}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;color:#111;-webkit-font-smoothing:antialiased}
.container{max-width:1200px;margin:0 auto;padding:0 24px}
/* ---------- Announcement ---------- */
.announce{background:#f4f4f4;font-size:11px;color:#333;display:flex;align-items:center;justify-content:center;gap:10px;padding:7px 12px;text-align:center}
.announce .pill{background:#111;color:#fff;border-radius:999px;padding:3px 10px;font-size:9px;font-weight:600;flex-shrink:0}
/* ---------- Header ---------- */
.header{background:#fff;border-bottom:1px solid #ececec}
.header-in{display:flex;align-items:center;height:64px;gap:40px}
.logo{font-size:22px;font-weight:800;letter-spacing:-.02em;color:#111}
.nav{display:flex;gap:26px;font-size:13px;color:#111}
.nav a:hover{opacity:.65}
.h-right{margin-left:auto;display:flex;align-items:center;gap:22px;font-size:12.5px;color:#111}
.h-item{display:flex;align-items:center;gap:7px;cursor:pointer}
.h-item:hover{opacity:.65}
.h-item svg{width:16px;height:16px}
/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;font-weight:600;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-white{background:#fff;color:#111;padding:11px 30px;font-size:12px}
.btn-black{background:#111;color:#fff;padding:11px 26px;font-size:11.5px}
/* ---------- Hero ---------- */
.hero{position:relative;height:560px;background-position:center;background-size:cover}
.hero::after{content:'';position:absolute;inset:0;background:rgba(25,25,25,.30)}
.hero-in{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:0 24px}
.hero h1{font-size:54px;font-weight:700;letter-spacing:-.01em}
.hero p{margin-top:14px;max-width:660px;font-size:12.5px;line-height:1.7;color:#f2f2f2}
.hero .btn-white{margin-top:30px}
/* ---------- Sections ---------- */
.section{padding:72px 0}
.sec-title{font-size:30px;font-weight:700;text-align:center;letter-spacing:-.01em}
.sec-sub{margin-top:10px;text-align:center;font-size:12.5px;color:#8a8a8a}
/* ---------- Product cards ---------- */
.p-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:44px}
.p-img{position:relative;background:#f3f3f3;border-radius:10px;aspect-ratio:1;overflow:hidden;cursor:pointer}
.p-img img{width:100%;height:100%;object-fit:cover}
.heart{position:absolute;top:10px;right:10px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:#8b8b8b;border-radius:50%;z-index:2}
.heart svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8}
.heart.active{color:#e12d2d}
.heart.active svg{fill:#e12d2d;stroke:#e12d2d}
.badge{position:absolute;top:10px;left:10px;background:#e6e6e6;color:#666;font-size:10px;padding:4px 9px;border-radius:7px;font-weight:500;z-index:2}
.p-name{margin-top:12px;font-size:13px;color:#222}
.p-row{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.p-price{font-size:13px;font-weight:700}
.p-add{width:28px;height:28px;border:1px solid #e2e2e2;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:#111}
.p-add:hover{background:#111;color:#fff}
.p-add svg{width:13px;height:13px}
.see-all{margin:44px auto 0;display:flex;padding:12px 36px;font-size:12px}
/* ---------- Tokyo ---------- */
.tokyo{display:grid;grid-template-columns:1.05fr 1fr;gap:56px;align-items:center;padding:56px 0}
.tokyo-img{border-radius:6px;overflow:hidden;aspect-ratio:4/3;background:#eee}
.tokyo-img img{width:100%;height:100%;object-fit:cover}
.tokyo h2{font-size:27px;font-weight:700;line-height:1.35;letter-spacing:-.01em}
.tokyo p{margin-top:16px;font-size:12px;color:#9a9a9a;line-height:1.8}
.tokyo .sale-l{margin-top:26px;font-size:13px;font-weight:700;color:#111}
.tokyo .sale-n{font-size:52px;font-weight:800;margin:6px 0 18px;letter-spacing:-.02em}
/* ---------- Collections ---------- */
.coll-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:44px}
.coll-col{display:flex;flex-direction:column;gap:24px}
.coll-card{position:relative;border-radius:8px;overflow:hidden;background:#ccc}
.coll-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.coll-card::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.18)}
.coll-in{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:16px}
.coll-in h3{font-size:24px;font-weight:600}
.coll-in p{margin-top:8px;font-size:10.5px;color:#eee;max-width:230px;line-height:1.6}
.coll-in .btn-white{margin-top:14px;padding:8px 24px;font-size:11px}
/* ---------- Newsletter ---------- */
.news{position:relative;background-position:center;background-size:cover;padding:78px 24px;text-align:center;color:#fff}
.news::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.55)}
.news-in{position:relative;z-index:1}
.news h2{font-size:28px;font-weight:700}
.news p{margin:12px auto 26px;font-size:12px;color:#ddd;max-width:600px;line-height:1.7}
.news-form{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.news-input{width:300px;max-width:78vw;border-radius:999px;padding:11px 18px;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.18);color:#fff;font-size:12px;outline:none;font-family:inherit}
.news-input::placeholder{color:#e2e2e2}
.news-form .btn-white{padding:11px 28px;font-size:12px}
/* ---------- Footer ---------- */
.footer{background:#0c0c0c;color:#9ca3af;padding:56px 0 0;font-size:12px}
.f-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr auto;gap:40px;align-items:start}
.f-brand .logo{color:#fff;font-size:24px}
.f-brand p{margin-top:14px;line-height:1.8;max-width:250px}
.f-col h4{color:#fff;font-size:13px;font-weight:600;margin-bottom:18px}
.f-col a{display:block;margin-bottom:12px;color:#9ca3af}
.f-col a:hover{color:#fff}
.f-social{display:flex;gap:14px;color:#fff;padding-top:4px}
.f-social a:hover{opacity:.7}
.f-social svg{width:16px;height:16px}
.f-bottom{margin-top:48px;border-top:1px solid #1f1f1f;padding:18px 0 22px}
.f-bottom-in{position:relative;display:flex;align-items:center;justify-content:center;font-size:11px;color:#9ca3af}
.f-right{position:absolute;right:0;display:flex;gap:28px}
/* ---------- Product page ---------- */
.crumb{display:flex;gap:8px;align-items:center;font-size:11px;color:#9a9a9a;padding:18px 0}
.crumb a:hover{color:#111}
.crumb .sep{color:#cfcfcf}
.crumb .cur{color:#111}
.pdp{display:grid;grid-template-columns:1.12fr 1fr;gap:32px;align-items:start}
.gallery{display:grid;grid-template-columns:88px 1fr;gap:16px;align-items:start}
.thumbs{display:flex;flex-direction:column;gap:12px}
.thumb{width:88px;height:88px;border-radius:8px;overflow:hidden;background:#f3f3f3;padding:0;border:1px solid transparent;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.sel{border-color:#d5d5d5}
.thumb-more{width:40px;height:40px;margin:4px auto 0;border:1px solid #e3e3e3;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff}
.thumb-more:hover{background:#f5f5f5}
.main-img{position:relative;background:#f3f3f3;border-radius:12px;aspect-ratio:1;overflow:hidden}
.main-img img{width:100%;height:100%;object-fit:cover}
.disc{position:absolute;top:14px;left:14px;background:#ef3e36;color:#fff;font-size:11px;font-weight:600;padding:4px 9px;border-radius:6px}
.heart-circle{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.08);color:#333}
.heart-circle svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8}
.heart-circle.active{color:#e12d2d}
.heart-circle.active svg{fill:#e12d2d;stroke:#e12d2d}
.info h1{font-size:26px;font-weight:700;letter-spacing:-.01em}
.rate-row{display:flex;align-items:center;gap:10px;margin-top:12px}
.rate-count{font-size:12px;color:#8a8a8a}
.stars{display:inline-flex;gap:2px;align-items:center}
.star{position:relative;display:inline-block}
.star>svg{display:block}
.star-clip{position:absolute;left:0;top:0;height:100%;overflow:hidden;display:flex}
.price-row{display:flex;align-items:baseline;gap:12px;margin-top:16px}
.price{font-size:24px;font-weight:800}
.price-old{font-size:15px;color:#b0b0b0;text-decoration:line-through}
.p-desc{margin-top:16px;font-size:13px;color:#555;line-height:1.7;max-width:430px}
.opt{margin-top:22px;font-size:12px;color:#444}
.swatches{display:flex;gap:12px;margin-top:10px}
.swatch{width:30px;height:30px;border-radius:50%;cursor:pointer}
.swatch.sel{box-shadow:0 0 0 2px #fff,0 0 0 4px #111}
.qty-row{display:flex;gap:10px;margin-top:10px}
.qty-btn{width:38px;height:38px;border:1px solid #e2e2e2;border-radius:8px;background:#fff;font-size:16px}
.qty-btn:hover{background:#f5f5f5}
.qty-val{width:38px;height:38px;border:1px solid #e2e2e2;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px}
.add-cart{width:100%;margin-top:24px;background:#111;color:#fff;border-radius:999px;padding:14px;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px}
.add-cart:hover{opacity:.85}
.add-cart svg{width:15px;height:15px}
.buy-now{width:100%;margin-top:12px;background:#f1f1f1;color:#111;border-radius:999px;padding:14px;font-size:13px;font-weight:600}
.buy-now:hover{background:#e7e7e7}
.perks{display:flex;gap:28px;margin-top:26px}
.perk{display:flex;gap:10px;align-items:flex-start}
.perk svg{width:20px;height:20px;color:#111;flex-shrink:0}
.perk b{font-size:12px;display:block;font-weight:600}
.perk span{font-size:11px;color:#8a8a8a}
/* ---------- Description tabs ---------- */
.desc-sec{display:grid;grid-template-columns:1fr 1fr;gap:56px;margin-top:60px}
.tabs{display:flex;gap:34px;border-bottom:1px solid #e7e7e7}
.tab{padding:12px 2px;font-size:13px;color:#8a8a8a;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:#111;border-color:#111;font-weight:600}
.desc-body{padding-top:24px;font-size:13px;color:#555;line-height:1.8}
.desc-body ul{margin-top:18px;list-style:none}
.desc-body li{margin-bottom:12px;padding-left:16px;position:relative;font-size:12px;color:#666}
.desc-body li::before{content:'•';position:absolute;left:0;color:#666}
.desc-img{width:100%;height:100%;min-height:360px;object-fit:cover}
/* ---------- Reviews ---------- */
.reviews{margin-top:56px;border-top:1px solid #eee;padding-top:40px}
.rev-head{display:flex;align-items:center;justify-content:space-between}
.rev-head h2{font-size:17px;font-weight:700}
.rev-head h2 span{font-weight:500;color:#555}
.view-all{font-size:12px;color:#555}
.view-all:hover{color:#111}
.rev-grid{display:grid;grid-template-columns:auto 1fr 1.25fr auto;gap:44px;align-items:center;margin-top:28px}
.rev-score .big{font-size:52px;font-weight:800;letter-spacing:-.02em}
.rev-score .stars{margin:12px 0 10px}
.rev-score .sub{font-size:11px;color:#8a8a8a}
.bars{display:flex;flex-direction:column;gap:9px;min-width:250px}
.bar-row{display:flex;align-items:center;gap:8px;font-size:11px;color:#555}
.bar-row .n{width:8px}
.bar-row .star-i{color:#f59e0b;display:flex}
.bar-track{flex:1;height:5px;background:#ececec;border-radius:999px;overflow:hidden}
.bar-fill{height:100%;background:#111;border-radius:999px}
.bar-pct{width:32px;text-align:right;color:#777}
.rev-card{background:#f7f7f7;border-radius:12px;padding:22px}
.rev-top{display:flex;justify-content:space-between;align-items:center}
.rev-date{font-size:11px;color:#8a8a8a}
.rev-title{margin-top:14px;font-size:13px;font-weight:700}
.rev-text{margin-top:8px;font-size:12px;color:#666;line-height:1.7}
.rev-author{margin-top:14px;font-size:12px;font-weight:600}
.rev-nav{display:flex;gap:10px}
.rev-arrow{width:38px;height:38px;border:1px solid #e3e3e3;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
.rev-arrow:hover{background:#f5f5f5}
.rev-arrow svg{width:14px;height:14px}
.related h2{font-size:18px;font-weight:700;margin:56px 0 24px}
.rel-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:20px}
.rel-grid .p-name{font-size:12px}
.rel-grid .p-price{font-size:12px}
/* ---------- Responsive ---------- */
@media (max-width:1100px){
  .p-grid{grid-template-columns:repeat(3,1fr)}
  .rel-grid{grid-template-columns:repeat(3,1fr)}
  .rev-grid{grid-template-columns:auto 1fr;gap:32px}
  .f-grid{grid-template-columns:1.4fr 1fr 1fr;row-gap:36px}
  .f-social{grid-column:1/-1}
}
@media (max-width:900px){
  .nav{display:none}
  .pdp{grid-template-columns:1fr}
  .gallery{grid-template-columns:1fr}
  .thumbs{flex-direction:row;order:2;overflow-x:auto}
  .thumb{flex-shrink:0}
  .thumb-more{margin:0}
  .desc-sec{grid-template-columns:1fr;gap:28px}
  .desc-img{min-height:260px}
  .tokyo{grid-template-columns:1fr;gap:28px;padding:40px 0}
  .coll-grid{grid-template-columns:1fr 1fr}
  .rev-grid{grid-template-columns:1fr;gap:28px}
  .f-grid{grid-template-columns:1fr 1fr}
  .hero{height:460px}
  .hero h1{font-size:40px}
}
@media (max-width:640px){
  .p-grid{grid-template-columns:repeat(2,1fr);gap:14px}
  .rel-grid{grid-template-columns:repeat(2,1fr);gap:14px}
  .coll-grid{grid-template-columns:1fr}
  .hero h1{font-size:32px}
  .sec-title{font-size:24px}
  .tokyo h2{font-size:22px}
  .tokyo .sale-n{font-size:42px}
  .f-grid{grid-template-columns:1fr}
  .f-bottom-in{flex-direction:column;gap:10px}
  .f-right{position:static;gap:18px}
  .perks{flex-direction:column;gap:16px}
  .h-right{gap:14px}
  .section{padding:52px 0}
}

/* ===== HIDDEN INFRASTRUCTURE STYLES (toast, cart drawer, zoom overlay) ===== */
/* These styles are for NEW elements added to support black's backend services.
   They do NOT modify any existing black-update styles. */

/* Toast notification */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:#111;color:#fff;padding:12px 24px;border-radius:8px;font-size:13px;font-weight:500;z-index:99999;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.15);max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toastMsg{display:inline-block}

/* Cart drawer (slide-in from right) */
#cartOverlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9997;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
#cartOverlay.active{opacity:1;visibility:visible}
#cartDrawer{position:fixed;top:0;right:0;bottom:0;width:380px;max-width:90vw;background:#fff;z-index:9998;transform:translateX(100%);transition:transform .3s;display:flex;flex-direction:column;font-family:'Inter',sans-serif}
#cartDrawer.active{transform:translateX(0)}
#cartDrawer .cart-header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid #ececec}
#cartDrawer .cart-header h3{font-size:16px;font-weight:700;color:#111}
#cartDrawer .cart-close{font-size:24px;color:#999;background:none;border:none;cursor:pointer;line-height:1}
#cartDrawer .cart-close:hover{color:#111}
#cartDrawer .cart-body{flex:1;overflow-y:auto;padding:16px 20px}
#cartDrawer .cart-empty{text-align:center;padding:40px 20px;color:#888}
#cartDrawer .cart-empty svg{width:48px;height:48px;margin:0 auto 12px;display:block;stroke:#ccc}
#cartDrawer .cart-empty h4{font-size:15px;font-weight:600;color:#333;margin-bottom:6px}
#cartDrawer .cart-empty p{font-size:12px;color:#999}
#cartDrawer .cart-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #f0f0f0}
#cartDrawer .cart-item-img{width:60px;height:60px;border-radius:8px;overflow:hidden;background:#f3f3f3;flex-shrink:0}
#cartDrawer .cart-item-img img{width:100%;height:100%;object-fit:cover}
#cartDrawer .cart-item-info{flex:1;min-width:0}
#cartDrawer .cart-item-name{font-size:13px;font-weight:600;color:#111;margin-bottom:4px}
#cartDrawer .cart-item-variant{font-size:11px;color:#888;margin-bottom:8px}
#cartDrawer .cart-item-controls{display:flex;align-items:center;justify-content:space-between}
#cartDrawer .cart-item-qty{display:flex;align-items:center;gap:8px}
#cartDrawer .cart-item-qty button{width:24px;height:24px;border:1px solid #e2e2e2;border-radius:4px;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
#cartDrawer .cart-item-qty button:hover{background:#f5f5f5}
#cartDrawer .cart-item-qty span{font-size:13px;font-weight:600;min-width:20px;text-align:center}
#cartDrawer .cart-item-price{font-size:13px;font-weight:700;color:#111}
#cartDrawer .cart-item-remove{width:28px;height:28px;background:none;border:none;cursor:pointer;color:#999;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#cartDrawer .cart-item-remove:hover{color:#e12d2d}
#cartDrawer .cart-footer{padding:16px 20px;border-top:1px solid #ececec;background:#fafafa}
#cartDrawer .cart-total-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;color:#555}
#cartDrawer .cart-total-row.grand{font-size:16px;font-weight:700;color:#111;border-top:1px solid #ddd;padding-top:8px;margin-top:4px}
#cartDrawer .btn-cart-checkout{width:100%;margin-top:12px;padding:14px;background:#111;color:#fff;border:none;border-radius:999px;cursor:pointer;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit}
#cartDrawer .btn-cart-checkout:hover{opacity:.85}

/* Zoom overlay (full-screen image viewer) */
#zoomOverlay{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:99999;display:none;align-items:center;justify-content:center;flex-direction:column}
#zoomOverlay.active{display:flex}

    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
    // ✅ FIX: Use unified SHV_CONFIG from shared/supabase.js (single source of truth)
    const SUPABASE_URL = window.SHV_CONFIG.SUPABASE_URL;
    const SUPABASE_PUBLISHABLE_KEY = window.SHV_CONFIG.SUPABASE_PUBLISHABLE_KEY;
    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
      auth: { persistSession: false },
      realtime: { params: { eventsPerSecond: 5 } },
    });
    // ✨ اجعل supabase متاحاً لـ shared/orders.js (الذي يستخدم window.supabase)
    window.supabase = supabase;

    // ✨ saveOrderData + _shvVerifyOrderPrices انتقلتا إلى shared/orders.js
    // (مُحمَّلة في <head>). الكود هنا يستدعي window.saveOrderData() و
    // window._shvVerifyOrderPrices() مباشرة — انظر نقاط الاستدعاء في checkout flow.

    // ✨ fetchStoreData + subscribeToStoreProducts + reviews/pixels helpers — انتقلت إلى shared/store-data.js
    // (الدوال الموحَّدة تُحمَّل عبر <script src="/shared/store-data.js"> في <head>)

    // ✨ Template redirect — استخدم shared/theme-router.js الموحَّد
    (async function templateRedirect() {
      const storeId = window._getStoreId();
      if (!storeId) return;
      try {
        const { store } = await window.fetchStoreData(storeId);
        if (!store) return;
        // shvRedirectToTheme يتعامل مع كل الفروع (noir/neon/zephyr) + منع loop
        window.shvRedirectToTheme(store.template || store.theme || '');
      } catch (e) {}
    })();

</script>

            getProductById: function (id) { return this.products.find(function (p) { return String(p.id) === String(id); }); },
            getCategoryById: function (id) { return this.categories.find(function (c) { return c.id === id; }); },
            getProductsByCategory: function (catId) {
                if (!catId || catId === 'all') return this.products;
                return this.products.filter(function (p) { return p.category === catId; });
            },
            getRelatedProducts: function (currentId, limit) {
                limit = limit || 4;
                var current = this.getProductById(currentId);
                if (!current) return this.products.slice(0, limit);
                var sameCat = this.products.filter(function (p) { return p.category === current.category && p.id !== current.id; });
                var others = this.products.filter(function (p) { return p.category !== current.category && p.id !== current.id; });
                return sameCat.concat(others).slice(0, limit);
            },
            formatPrice: function (n) { return formatDA(n); },
            discountPercent: function (price, original) {
                if (!original || original <= price) return 0;
                return Math.round(((original - price) / original) * 100);
            },
            searchProducts: function (query) {
                if (!query) return this.products;
                var q = query.trim().toLowerCase();
                if (!q) return this.products;
                return this.products.filter(function (p) {
                    var cat = this.getCategoryById(p.category);
                    var haystack = [p.name, p.shortDesc, p.categoryLabel, cat ? cat.name : '', p.badge, p.details.join(' '), p.colors.map(function (c) { return c.name; }).join(' ')].join(' ').toLowerCase();
                    return haystack.indexOf(q) !== -1;
                }.bind(this));
            }

            if (lang !== 'ar' && lang !== 'en') lang = 'en';
            currentLang = lang;
            try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
            // Set <html> lang and dir attributes
            var dir = (lang === 'ar') ? 'rtl' : 'ltr';
            document.documentElement.lang = lang;
            document.documentElement.dir = dir;
            // Update language toggle button label (header)
            var btn = document.getElementById('langToggle');
            if (btn) {
                var code = btn.querySelector('.lang-code');
                if (code) {
                    code.textContent = (lang === 'ar') ? 'EN' : 'ع';
                }
                btn.setAttribute('aria-label', (lang === 'ar') ? 'Switch to English' : 'التبديل إلى العربية');
                btn.setAttribute('title', (lang === 'ar') ? 'Switch to English' : 'التبديل إلى العربية');

            if (btnMobileText) {
                btnMobileText.textContent = (lang === 'ar') ? 'EN — English' : 'ع — العربية';
            }
            // Re-translate static elements with [data-i18n]
            var els = document.querySelectorAll('[data-i18n]');
            for (var i = 0; i < els.length; i++) {
                var key = els[i].getAttribute('data-i18n');
                els[i].textContent = t(key);
            }
            // Re-translate placeholders
            var phs = document.querySelectorAll('[data-i18n-ph]');
            for (var j = 0; j < phs.length; j++) {
                var pkey = phs[j].getAttribute('data-i18n-ph');
                phs[j].setAttribute('placeholder', t(pkey));
            }

        function openZoomViewer(index) {

        function sortProducts(arr, sort) {
            var sorted = arr.slice();
            switch (sort) {
                case 'price-asc': sorted.sort(function (a, b) { return a.price - b.price; }); break;
                case 'price-desc': sorted.sort(function (a, b) { return b.price - a.price; }); break;
                case 'rating': sorted.sort(function (a, b) { return b.rating - a.rating; }); break;
                case 'newest': sorted.sort(function (a, b) { return (b.isNew ? 1 : 0) - (a.isNew ? 1 : 0); }); break;
            }
            return sorted;
        }

                      '<button type="button" class="summary-delivery-btn'+(deliveryType==='home'?' active':'')+'" data-delivery="home">'+I.truck+'<span>'+escapeHTML(t('delivery_home') || 'Home')+'</span></button>'+
                      '<button type="button" class="summary-delivery-btn'+(deliveryType==='office'?' active':'')+'" data-delivery="office">'+I.shield+'<span>'+escapeHTML(t('delivery_office') || 'Office')+'</span></button>'+
                    '</div>'+
                    '<textarea class="summary-textarea" id="cpAddress" placeholder="'+escapeHTML(t('of_address_ph') || 'Detailed Address *')+'" maxlength="300">'+escapeHTML(d.address||'')+'</textarea>'+
                    '<textarea class="summary-textarea" id="cpNotes" placeholder="'+escapeHTML(t('of_notes_ph') || 'Additional Notes')+'" maxlength="500" style="min-height:40px">'+escapeHTML(d.notes||'')+'</textarea>'+
                    cartTtsHTML+
                    '<div id="turnstileWidgetWrap" style="margin:0.75rem 0;display:flex;justify-content:center;"><div id="checkout-turnstile-widget" class="cf-turnstile" data-sitekey="'+escapeHTML((window.SHV_CONFIG && window.SHV_CONFIG.TURNSTILE_SITE_KEY) || '')+'" data-callback="onCheckoutTurnstileSuccess" data-theme="light" data-language="ar"></div></div>'+

        function descBody() {
          var P = DATA.product;
          if (state.tab === 'description') {
            // Use ACTUAL product description + details
            var desc = P.desc || P.shortDesc || '';
            var html = '';
            if (desc) html += '<p>'+escapeHTML(desc)+'</p>';
            if (P.bullets && P.bullets.length) {
              html += '<ul>'+P.bullets.map(function(b){return '<li>'+escapeHTML(b)+'</li>';}).join('')+'</ul>';
            }
            if (!html) html = '<p>No description available.</p>';
            return html;
          }
          if (state.tab === 'features') {
            // Show details as features list
            if (P.details && P.details.length) {
              return '<ul>'+P.details.map(function(b){return '<li>'+escapeHTML(b)+'</li>';}).join('')+'</ul>';
            }
            if (P.materials) return '<p>'+escapeHTML(P.materials)+'</p>';
            return '<p>Features not specified.</p>';
          }
          // Shipping & Returns — use ACTUAL product shippingReturns
          var shipText = P.shippingReturns || 'Free shipping on orders over 5,000 DA. If you are not completely satisfied, enjoy a 30-day return with a money-back guarantee. Secure payment, 100% protected.';
          return '<p>'+escapeHTML(shipText)+'</p>';
        }

        function reviewCard() {
          var list = DATA.reviewsList;
          if (!list.length) {
            return '<div class="rev-top"><span class="rev-date">No reviews yet</span></div>'+
              '<div class="rev-title">Be the first to review!</div>'+
              '<p class="rev-text">Share your thoughts about this product.</p>';
          }
          var r = list[state.review] || list[0];
          return '<div class="rev-top">'+stars(r.stars,12,'#111')+'<span class="rev-date">'+escapeHTML(r.date)+'</span></div>'+
            '<div class="rev-title">'+escapeHTML(r.title)+'</div><p class="rev-text">'+escapeHTML(r.text)+'</p><div class="rev-author">'+escapeHTML(r.author)+'</div>';
        }

        function productView() {
          var P = DATA.product;
          var hasDiscount = P.oldPrice && P.oldPrice > P.price;
          var discountPct = hasDiscount ? Math.round(((P.oldPrice - P.price) / P.oldPrice) * 100) : 0;
          // Free shipping badge
          var freeShipBadge = P.freeShipping ? '<span class="badge" style="background:#e6f4ea;color:#1e7e34;top:36px;left:10px;">Free Ship</span>' : '';
          return announceBar(DATA.announce.product)+header()+
          '<div class="container">'+
            '<div class="crumb"><a href="#/" data-go="home">Home</a><span class="sep">&gt;</span><a href="#" data-noop>Products</a><span class="sep">&gt;</span><span class="cur">'+escapeHTML(P.name)+'</span></div>'+
            '<div class="pdp">'+
              '<div class="gallery">'+
                '<div class="thumbs">'+P.thumbs.map(function(t,i){return '<button class="thumb'+(i===state.thumb?' sel':'')+'" data-thumb="'+i+'"><img src="'+t+'" alt="view '+(i+1)+'"></button>';}).join('')+
                (P.thumbs.length > 1 ? '<button class="thumb-more" data-thumbnext aria-label="more views">'+I.chevD+'</button>' : '')+'</div>'+
                '<div class="main-img"><img id="mainImg" src="'+P.thumbs[state.thumb]+'" alt="'+escapeHTML(P.name)+'">'+
                (hasDiscount ? '<span class="disc">-'+discountPct+'%</span>' : '')+
                freeShipBadge+
                '<button class="heart-circle'+(state.wish['main']?' active':'')+'" data-wish="main" aria-label="wishlist">'+I.heart+'</button></div>'+
              '</div>'+
              '<div class="info">'+
                '<h1>'+escapeHTML(P.name)+'</h1>'+
                (P.reviews > 0 ? '<div class="rate-row">'+stars(P.rating,15,'#f59e0b')+'<span class="rate-count">('+P.reviews+' reviews)</span></div>' : '')+
                '<div class="price-row"><span class="price">'+formatProductPrice(P.price)+'</span>'+(hasDiscount ? '<span class="price-old">'+formatProductPrice(P.oldPrice)+'</span>' : '')+'</div>'+
                (P.desc ? '<p class="p-desc">'+escapeHTML(P.desc)+'</p>' : '')+
                // ✅ FIX: IDs and classes here are scoped with `doc-` prefix to avoid collisions
                //    with the product page's #colorName / #sizeValue / .swatch / .size-btn.
                //    The direct order card is rendered INSIDE renderProductPage, so both sets
                //    of elements exist in the DOM at the same time. Without this scoping,
                //    getElementById('colorName') returns the FIRST match (the product page's
                //    span), and querySelectorAll('.size-btn') resets styles on ALL size
                //    buttons (including the product page's).
                (P.colors && P.colors.length > 0 ? '<div class="opt">Color: &nbsp;<span id="docColorName">'+escapeHTML(state.color)+'</span></div>' : '')+
                (P.colors && P.colors.length > 0 ?
                  '<div class="swatches doc-swatches">'+P.colors.map(function(c,i){return '<button class="swatch doc-swatch'+(c.name===state.color?' sel':'')+'" data-swatch="'+escapeHTML(c.name)+'" data-index="'+i+'" style="background:'+c.hex+'" aria-label="'+escapeHTML(c.name)+'"></button>';}).join('')+'</div>'
                : '')+
                // Size selector (NEW — black-update didn't have this, but it's REQUIRED for order)
                (P.sizes && P.sizes.length > 0 ?
                  '<div class="opt">Size: &nbsp;<span id="docSizeValue">'+escapeHTML(state.selectedSize || 'Select size')+'</span></div>'+
                  '<div class="swatches doc-size-row" style="gap:8px;">'+P.sizes.map(function(s){return '<button class="qty-btn size-btn doc-size-btn'+(state.selectedSize===s?' sel':'')+'" data-size="'+escapeHTML(s)+'" style="width:auto;padding:8px 14px;font-size:12px;'+(state.selectedSize===s?'background:#111;color:#fff;border-color:#111;':'')+'">'+escapeHTML(s)+'</button>';}).join('')+'</div>'
                : '')+
                '<div class="opt">Quantity:</div>'+
                '<div class="qty-row"><button class="qty-btn" data-qty="-1">\u2212</button><span class="qty-val" id="docQtyVal">'+state.qty+'</span><button class="qty-btn" data-qty="1">+</button></div>'+
                '<button class="add-cart" data-addcart>Add to Cart '+I.cart+'</button>'+
                '<button class="buy-now" data-buynow>Buy Now</button>'+
                '<div class="perks">'+
                  buildPerksHTML()+
                '</div>'+
              '</div>'+
            '</div>'+
            // ── Direct Order Card (inline order form on product page) ──
            directOrderCardHTML(P)+
            '<div class="desc-sec">'+
              '<div><div class="tabs">'+
                '<button class="tab'+(state.tab==='description'?' active':'')+'" data-tab="description">Description</button>'+
                '<button class="tab'+(state.tab==='features'?' active':'')+'" data-tab="features">Features</button>'+
                '<button class="tab'+(state.tab==='shipping'?' active':'')+'" data-tab="shipping">Shipping & Returns</button>'+
              '</div><div class="desc-body" id="descBody">'+descBody()+'</div></div>'+
              '<img class="desc-img" src="'+(P.thumbs[1] || P.thumbs[0] || FALLBACK_IMG.lifestyle)+'" alt="'+escapeHTML(P.name)+'" loading="lazy">'+
            '</div>'+
            (DATA.reviewsList.length > 0 || P.reviewsText ?
            '<div class="reviews">'+
              '<div class="rev-head"><h2>Customer Reviews <span>('+P.reviews+')</span></h2></div>'+
              '<div class="rev-grid">'+
                '<div class="rev-score"><div class="big">'+(P.rating || 0).toFixed(1)+'</div>'+stars(P.rating,16,'#f59e0b')+'<div class="sub">Based on '+P.reviews+' reviews</div></div>'+
                '<div class="bars">'+DATA.bars.map(function(b){return '<div class="bar-row"><span class="n">'+b[0]+'</span><span class="star-i">'+starSVG(10)+'</span><div class="bar-track"><div class="bar-fill" style="width:'+b[1]+'%"></div></div><span class="bar-pct">'+b[1]+'%</span></div>';}).join('')+'</div>'+
                '<div class="rev-card" id="revCard">'+reviewCard()+'</div>'+
                (DATA.reviewsList.length > 1 ? '<div class="rev-nav"><button class="rev-arrow" data-rev="-1" aria-label="previous">'+I.chevL+'</button><button class="rev-arrow" data-rev="1" aria-label="next">'+I.chevR+'</button></div>' : '')+
              '</div>'+
            '</div>' : '')+
            (DATA.related.length > 0 ?
            '<div class="related"><h2>You Might Also Like</h2>'+
            '<div class="rel-grid">'+DATA.related.map(function(p){return productCard(p,false);}).join('')+'</div></div>' : '')+
          '</div>'+
          newsletter()+footer(DATA.footer.product);
        }

        /* ---------- 10. TRUST PERKS (uses store settings) ---------- */
        function buildPerksHTML() {
          var sd = window._storeData || {};
          var hide = sd.hideTrustIcons || {};
          var txt = sd.trustIconsText || {};
          var perks = [
            { key: 'free_shipping', hidden: !!hide.free_shipping,
              title: txt.free_shipping_title || t('trust_free_title') || 'Free Shipping',
              desc: txt.free_shipping_desc || t('trust_free_desc') || 'on orders over 5,000 DA',
              icon: I.truck },
            { key: 'easy_returns', hidden: !!hide.easy_returns,
              title: txt.easy_returns_title || t('trust_returns_title') || '30-Day Return',
              desc: txt.easy_returns_desc || t('trust_returns_desc') || 'Money back guarantee',
              icon: I.ret },
            { key: 'secure_payment', hidden: !!hide.secure_payment,
              title: txt.secure_payment_title || t('trust_secure_title') || 'Secure Payment',
              desc: txt.secure_payment_desc || t('trust_secure_desc') || '100% protected',
              icon: I.shield }
          ];
          var visible = perks.filter(function(p) { return !p.hidden; });
          if (!visible.length) return '';
          return visible.map(function(p) {
            return '<div class="perk">'+p.icon+'<div><b>'+escapeHTML(p.title)+'</b><span>'+escapeHTML(p.desc)+'</span></div></div>';
          }).join('');
        }

        /* ---------- 11. ROUTER ---------- */
        var app = document.getElementById('app');
        function page() {
          var h = location.hash || '';
          if (h.indexOf('product') > -1) return 'product';
          if (h.indexOf('cart') > -1) return 'cart';
          return 'home';
        }
        function render(scrollTop) {
          var p = page();
          if (p === 'product') app.innerHTML = productView();
          else if (p === 'cart') app.innerHTML = cartView();
          else app.innerHTML = homeView();
          if (scrollTop !== false) window.scrollTo(0, 0);
          if (window.lucide) lucide.createIcons();
        }
        function route() { render(true); }
        function syncCart() {
          var total = getCart().reduce(function(s, i) { return s + i.qty; }, 0);
          state.cart = total;
          var els = document.querySelectorAll('.cart-count');
          for (var i = 0; i < els.length; i++) els[i].textContent = total;
        }

        /* ---------- 12. NAVIGATION HELPER ---------- */
        function navigateToProduct(product) {
          if (!product) return;
          state.product = product;
          state.selectedColor = 0;
          state.selectedSize = (product.sizes && product.sizes.length) ? product.sizes[0] : null;
          state.quantity = 1;
          state.qty = 1;
          state.color = (product.colors && product.colors[0]) ? product.colors[0].name : 'Default';
          state.tab = 'description';
          state.thumb = 0;
          state.currentImage = 0;
          state.review = 0;
          state.wishlist = false;
          if (typeof window.ShvPixels === 'object') window.ShvPixels.track('ViewContent', { content_ids: [String(product.id)], content_name: product.name, value: window._effectivePrice ? window._effectivePrice(product) : product.price, currency: 'DZD' });
          location.hash = '#/product';
        }

        /* ---------- 13. SEARCH OVERLAY ---------- */
        var searchOverlay = null;
        function openSearchOverlay() {
          if (!searchOverlay) {
            searchOverlay = document.createElement('div');
            searchOverlay.id = 'searchOverlay';
            searchOverlay.style.cssText = 'position:fixed;inset:0;z-index:9998;background:rgba(0,0,0,.5);display:none;align-items:flex-start;justify-content:center;padding:60px 20px;';
            searchOverlay.innerHTML =
              '<div style="background:#fff;width:100%;max-width:600px;border-radius:12px;padding:24px;max-height:80vh;overflow-y:auto;">' +
                '<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">' +
                  '<input id="searchOverlayInput" type="text" placeholder="Search products..." style="flex:1;padding:10px 14px;border:1px solid #e2e2e2;border-radius:8px;font-size:14px;font-family:inherit;outline:none;">' +
                  '<button id="searchOverlayClose" style="padding:10px 16px;background:#111;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;">Close</button>' +
                '</div>' +
                '<div id="searchOverlayResults" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;"></div>' +
              '</div>';
            document.body.appendChild(searchOverlay);
            var inp = searchOverlay.querySelector('#searchOverlayInput');
            var closeBtn = searchOverlay.querySelector('#searchOverlayClose');
            var resultsEl = searchOverlay.querySelector('#searchOverlayResults');
            closeBtn.addEventListener('click', closeSearchOverlay);
            searchOverlay.addEventListener('click', function(e) { if (e.target === searchOverlay) closeSearchOverlay(); });
            inp.addEventListener('input', function() {
              var q = inp.value.trim().toLowerCase();
              if (!q) { resultsEl.innerHTML = '<p style="grid-column:1/-1;color:#999;text-align:center;padding:20px;">Type to search...</p>'; return; }
              var results = NEON_DATA.products.filter(function(p) { return matchesQuery(p, q); });
              results = sortProducts(results, 'featured');
              if (!results.length) { resultsEl.innerHTML = '<p style="grid-column:1/-1;color:#999;text-align:center;padding:20px;">No results found</p>'; return; }
              resultsEl.innerHTML = results.map(function(p) {
                var eff = window._effectivePrice ? window._effectivePrice(p) : p.price;
                return '<div class="p-card" data-product-id="'+p.id+'" style="cursor:pointer;">' +
                  '<div class="p-img" data-go="product"><img src="'+((p.images&&p.images[0])?p.images[0]:p.image)+'" alt="'+escapeHTML(p.name)+'" loading="lazy"></div>' +
                  '<div class="p-name">'+escapeHTML(p.name)+'</div>' +
                  '<div class="p-row"><span class="p-price">'+formatProductPrice(eff)+'</span></div>' +
                '</div>';
              }).join('');
              var cards = resultsEl.querySelectorAll('[data-go="product"]');
              cards.forEach(function(card) {
                card.addEventListener('click', function() {
                  var id = card.closest('[data-product-id]').getAttribute('data-product-id');
                  var product = NEON_DATA.getProductById(id);
                  closeSearchOverlay();
                  navigateToProduct(product);
                });
              });
            });
          }
          searchOverlay.style.display = 'flex';
          document.body.style.overflow = 'hidden';
          var inp = searchOverlay.querySelector('#searchOverlayInput');
          if (inp) { inp.value = ''; inp.focus(); var re = searchOverlay.querySelector('#searchOverlayResults'); if (re) re.innerHTML = '<p style="grid-column:1/-1;color:#999;text-align:center;padding:20px;">Type to search...</p>'; }
        }
        function closeSearchOverlay() {
          if (searchOverlay) searchOverlay.style.display = 'none';
          document.body.style.overflow = '';
        }

        /* ---------- 14. CHECKOUT MODAL ---------- */
        var checkoutModal = null;
        function openCheckoutModal() {
          var cart = getCart();
          if (!cart.length) { showToast(t('toast_cart_empty') || 'Cart is empty'); return; }
          if (!checkoutModal) {
            checkoutModal = document.createElement('div');
            checkoutModal.id = 'checkoutModal';
            checkoutModal.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.5);display:none;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;';
            document.body.appendChild(checkoutModal);
          }
          var d = state.checkoutData || {};
          var wilayaOptions = ALGERIAN_WILAYAS.map(function(w) { return '<option value="'+escapeHTML(w)+'"'+(d.wilaya===w?' selected':'')+'>'+escapeHTML(w)+'</option>'; }).join('');

          // ── Compute totals including TTS (Try Two Sizes) ──
          var subtotal = 0;
          var allFree = true;
          var cartTtsItems = []; // items that qualify for TTS
          cart.forEach(function(item) {
            subtotal += item.price * item.qty;
            // Check free shipping
            var itemFree = item.freeShipping === true;
            if (!itemFree && item.id && NEON_DATA && Array.isArray(NEON_DATA.products)) {
              var pFree = NEON_DATA.products.find(function(x){return String(x.id)===String(item.id);});
              if (pFree && pFree.freeShipping === true) itemFree = true;
            }
            if (!itemFree) allFree = false;
            // Check TTS availability for this item
            var prod = (item.id && NEON_DATA && Array.isArray(NEON_DATA.products)) ?
              NEON_DATA.products.find(function(x){return String(x.id)===String(item.id);}) : null;
            if (prod) {
              var effUnit = window._effectivePrice ? window._effectivePrice(prod) : prod.price;
              var ttsAvailable = !!(window._storeData && window._storeData.ttsEnabled === true
                                    && prod.ttsEnabled === true
                                    && prod.sizes && prod.sizes.length >= 2
                                    && effUnit >= (Number(window._storeData.ttsMinPrice) || 0));
              if (ttsAvailable) {
                cartTtsItems.push({ item: item, product: prod, effUnit: effUnit });
              }
            }
          });
          var shipping = allFree ? 0 : calcShipping(d.wilaya || '', subtotal, window._storeData, d.deliveryType || 'home');

          // TTS fee: sum of fees for items where TTS is enabled
          var ttsTotalFee = 0;
          var ttsEnabledItems = [];
          if (cartTtsItems.length > 0 && state.ttsCart) {
            cartTtsItems.forEach(function(ct) {
              var itemKey = String(ct.item.id) + '|' + ct.item.size + '|' + ct.item.color;
              if (state.ttsCart[itemKey] && state.ttsCart[itemKey].enabled) {
                var fee = Number(ct.product.ttsFee || (window._storeData && window._storeData.ttsDefaultFee)) || 0;
                ttsTotalFee += fee;
                ttsEnabledItems.push({ item: ct.item, backupSize: state.ttsCart[itemKey].backupSize, fee: fee });
              }
            });
          }
          var total = subtotal + shipping + ttsTotalFee;

          // ── Build TTS section HTML (if any TTS-eligible items exist) ──
          var ttsSectionHTML = '';
          if (cartTtsItems.length > 0) {
            ttsSectionHTML = '<div style="background:#f5f3ff;border:1px solid #c4b5fd;border-radius:8px;padding:14px;margin-bottom:16px;">' +
              '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">' +
                '<span style="font-size:16px;">✨</span>' +
                '<h4 style="font-size:13px;font-weight:700;color:#5b21b6;margin:0;">' + escapeHTML(t('tts_title') || 'Try Two Sizes') + '</h4>' +
              '</div>' +
              '<p style="font-size:11px;color:#6b21a8;margin-bottom:12px;line-height:1.5;">' + escapeHTML(t('tts_desc') || 'Not sure about your size? Add a backup size for a small fee and we will ship both — keep the one that fits.') + '</p>';
            cartTtsItems.forEach(function(ct) {
              var itemKey = String(ct.item.id) + '|' + ct.item.size + '|' + ct.item.color;
              var ttsState = (state.ttsCart && state.ttsCart[itemKey]) || { enabled: false, backupSize: '' };
              var fee = Number(ct.product.ttsFee || (window._storeData && window._storeData.ttsDefaultFee)) || 0;
              ttsSectionHTML += '<div style="background:#fff;border:1px solid #ddd6fe;border-radius:6px;padding:10px;margin-bottom:8px;' + (ttsState.enabled ? '' : 'opacity:0.7;') + '">' +
                '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:' + (ttsState.enabled ? '8px' : '0') + ';">' +
                  '<div style="flex:1;"><div style="font-size:12px;font-weight:600;color:#333;">' + escapeHTML(ct.item.name) + '</div>' +
                  '<div style="font-size:10px;color:#888;">' + escapeHTML(t('os_size') || 'Size') + ': ' + escapeHTML(ct.item.size) + ' • ' + escapeHTML(t('tts_fee') || 'Fee') + ': ' + formatProductPrice(fee) + '</div></div>' +
                  '<button type="button" data-tts-toggle="' + escapeHTML(itemKey) + '" style="padding:4px 10px;border-radius:4px;font-size:11px;font-weight:600;cursor:pointer;border:none;background:' + (ttsState.enabled ? '#7c3aed' : '#e5e7eb') + ';color:' + (ttsState.enabled ? '#fff' : '#333') + ';">' + (ttsState.enabled ? '✓ Enabled' : (t('tts_add') || 'Add Backup')) + '</button>' +
                '</div>';
              if (ttsState.enabled) {
                ttsSectionHTML += '<div style="display:flex;gap:6px;flex-wrap:wrap;">' +
                  ct.product.sizes.map(function(s) {
                    var isCurrent = (s === ct.item.size);
                    var isBackup = (s === ttsState.backupSize);
                    return '<button type="button" data-tts-size="' + escapeHTML(itemKey) + '" data-size="' + escapeHTML(s) + '"' +
                      (isCurrent ? ' disabled' : '') +
                      ' style="padding:5px 10px;border:1px solid ' + (isBackup ? '#7c3aed' : '#ddd') + ';border-radius:4px;font-size:11px;cursor:' + (isCurrent ? 'not-allowed' : 'pointer') + ';background:' + (isBackup ? '#7c3aed' : '#fff') + ';color:' + (isBackup ? '#fff' : '#333') + ';' + (isCurrent ? 'opacity:0.5;' : '') + '">' + escapeHTML(s) + (isCurrent ? ' ✓' : '') + '</button>';
                  }).join('') +
                '</div>';
              }
              ttsSectionHTML += '</div>';
            });
            ttsSectionHTML += '</div>';
          }

          checkoutModal.innerHTML =
            '<div style="background:#fff;width:100%;max-width:560px;border-radius:12px;padding:28px;margin:auto;">' +

          checkoutModal.style.display = 'flex';

            var submitBtn = checkoutModal.querySelector('#checkoutSubmit');

              var freshShipping = freshAllFree ? 0 : calcShipping(wl, freshSubtotal, window._storeData, state.checkoutData.deliveryType);
              var freshTotal = freshSubtotal + freshShipping + ttsTotalFeeCheck;

              // ── Build items with TTS info ──
              var items = freshCart.map(function(i) {

                var ttsInfo = null;

                  ttsInfo = { backup_size: state.ttsCart[itemKey].backupSize, fee: 0 };
                  // Find the product to get the fee
                  var prod = NEON_DATA.products.find(function(x){return String(x.id)===String(i.id);});
                  if (prod) ttsInfo.fee = Number(prod.ttsFee || (window._storeData && window._storeData.ttsDefaultFee)) || 0;
                }
                return {
                  id: i.id, name: i.name, qty: i.qty, unit_price: i.price, line_total: i.price*i.qty,
                  size: i.size, color: i.color, free_shipping: i.freeShipping === true,
                  tts_enabled: !!(ttsInfo), tts_backup_size: ttsInfo ? ttsInfo.backup_size : null, tts_fee: ttsInfo ? ttsInfo.fee : 0
                };
              });

              var payload = {
                customer: { name: nm, phone: ph, wilaya: wl, commune: bl, address: ad, delivery_type: state.checkoutData.deliveryType, notes: nt },
                items: items,
                pricing: { subtotal: freshSubtotal, shipping_fee: freshShipping, tts_fee: ttsTotalFeeCheck, total: freshTotal, currency: 'DZD' },
                note: nt || null,
                try_two_sizes: ttsPayloadItems.length > 0,
                tts_backup_size: ttsPayloadItems.length === 1 ? ttsPayloadItems[0].backupSize : (ttsPayloadItems.length > 1 ? JSON.stringify(ttsPayloadItems) : null),
                tts_items: ttsPayloadItems.length > 0 ? ttsPayloadItems : null
              };
              if (typeof window._shvVerifyOrderPrices === 'function') {

                catch(verr) { showToast(t('of_required') + ': ' + (verr.message||'')); submitBtn.disabled = false; submitBtn.textContent = 'Place Order'; return; }

              state.checkoutData = { fullName:'', phone:'', wilaya:'', baladiya:'', address:'', notes:'', deliveryType:'home' };
              showToast(t('of_order_success') || 'Order placed successfully!');
              closeCheckoutModal();

              showToast(t('of_required') + ': ' + (err.message||''));

            } finally {
              submitBtn.disabled = false; submitBtn.textContent = 'Place Order';

        function closeCheckoutModal() {

        /* ---------- 15. EVENT DELEGATION ---------- */
        document.addEventListener('click', function(e) {
          var noop = e.target.closest('[data-noop]'); if (noop) { e.preventDefault(); return; }

          var wish = e.target.closest('[data-wish]');
          if (wish) {
            e.preventDefault(); e.stopPropagation();
            var id = wish.dataset.wish;
            state.wish = state.wish || {};
            state.wish[id] = !state.wish[id];
            wish.classList.toggle('active', !!state.wish[id]);
            try { localStorage.setItem('jolt_wish', JSON.stringify(state.wish)); } catch(err) {}
            showToast(state.wish[id] ? (t('toast_added_wishlist') || 'Added to wishlist') : (t('toast_removed_wishlist') || 'Removed from wishlist'));
            return;
          }

          var add = e.target.closest('[data-add]');

            e.preventDefault(); e.stopPropagation();
            var card = add.closest('[data-product-id]');
            var productId = card ? card.getAttribute('data-product-id') : null;
            var product = null;
            if (productId) product = NEON_DATA.getProductById(productId);
            if (!product) {
              var nameEl = card && card.querySelector('.p-name');
              var name = nameEl && nameEl.textContent;
              if (name) product = NEON_DATA.products.find(function(p) { return p.name === name; });
            }
            if (product) {
              var size = (product.sizes && product.sizes[0]) || 'One Size';
              var color = (product.colors && product.colors[0]) ? product.colors[0].name : 'Default';
              addToCart(product, size, color, 1);
              syncCart();
            }
            return;
          }

          var sw = e.target.closest('[data-swatch]');
          if (sw) {
            e.preventDefault();
            state.color = sw.dataset.swatch;
            state.selectedColor = parseInt(sw.dataset.index || '0', 10);
            // ✅ FIX: scope to .doc-swatch to avoid resetting product page's .color-swatch state
            var swatches = document.querySelectorAll('.doc-swatch');
            swatches.forEach(function(s) { s.classList.toggle('sel', s === sw); });
            // ✅ FIX: use #docColorName (was #colorName which collided with product page's span)
            var cn = document.getElementById('docColorName');
            if (cn) cn.textContent = state.color;
            return;
          }

          // Size selector (NEW) — but SKIP if it's a TTS backup size button (has data-tts-size)
          var sb = e.target.closest('[data-size]');
          if (sb && !sb.hasAttribute('data-tts-size')) {
            e.preventDefault();
            e.stopPropagation();
            state.selectedSize = sb.dataset.size;
            // ✅ FIX: scope to .doc-size-btn to avoid resetting product page's #sizeOptions .size-btn
            // (both have class="size-btn" so querySelectorAll('.size-btn') matches both sets)
            var sizeBtns = document.querySelectorAll('.doc-size-btn');
            sizeBtns.forEach(function(s) {
              s.classList.remove('sel');
              s.style.background = '#fff';
              s.style.color = '#111';
              s.style.borderColor = '#e2e2e2';
            });
            sb.classList.add('sel');
            sb.style.background = '#111';
            sb.style.color = '#fff';
            sb.style.borderColor = '#111';
            // ✅ FIX: use #docSizeValue (was #sizeValue which collided with product page's span)
            var sv = document.getElementById('docSizeValue');
            if (sv) sv.textContent = state.selectedSize;
            return;
          }

          // ── TTS toggle (Try Two Sizes enable/disable per cart item) ──
          var ttsToggle = e.target.closest('[data-tts-toggle]');
          if (ttsToggle) {
            e.preventDefault();
            e.stopPropagation();
            // Save form state before re-render (if on product page with direct order card)
            if (document.getElementById('docName')) saveDirectOrderFormState();
            if (document.getElementById('cpName')) saveCartPageFormState();
            var ttsKey = ttsToggle.getAttribute('data-tts-toggle');
            if (!state.ttsCart) state.ttsCart = {};
            if (!state.ttsCart[ttsKey]) state.ttsCart[ttsKey] = { enabled: false, backupSize: '' };
            state.ttsCart[ttsKey].enabled = !state.ttsCart[ttsKey].enabled;
            if (!state.ttsCart[ttsKey].enabled) state.ttsCart[ttsKey].backupSize = '';
            // Re-render: checkout modal if open, otherwise re-render page
            if (checkoutModal && checkoutModal.style.display === 'flex') {
              openCheckoutModal();
            } else {
              render(false);
            }
            return;
          }

          // ── TTS backup size selection ──
          var ttsSizeBtn = e.target.closest('[data-tts-size]');

            e.preventDefault();
            e.stopPropagation();

            var ttsSizeKey = ttsSizeBtn.getAttribute('data-tts-size');

              if (!state.selectedSize && bp.sizes && bp.sizes.length > 0) {

              var bsize = state.selectedSize || (bp.sizes && bp.sizes[0]) || 'One Size';

            return;

          var rv = e.target.closest('[data-rev]');

            e.preventDefault();
            var n = DATA.reviewsList.length;
            if (n > 0) {
              state.review = (state.review + parseInt(rv.dataset.rev, 10) + n) % n;
              var rc = document.getElementById('revCard');
              if (rc) rc.innerHTML = reviewCard();
            }
            return;
          }

          var go = e.target.closest('[data-go]');
          if (go) {
            e.preventDefault();
            if (go.dataset.go === 'product') {
              var goCard = go.closest('[data-product-id]');
              var goProductId = goCard ? goCard.getAttribute('data-product-id') : null;
              var goProduct = null;
              if (goProductId) goProduct = NEON_DATA.getProductById(goProductId);
              if (!goProduct && NEON_DATA.products.length) goProduct = NEON_DATA.products[0];
              if (goProduct) {
